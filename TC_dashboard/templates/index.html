<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn City Data Logger - Health Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Torn City Data Logger - Health Dashboard</h1>
            <div class="header-controls">
                <button id="refreshBtn" class="btn btn-primary">Refresh</button>
                <span id="lastUpdate" class="last-update">Never updated</span>
            </div>
        </header>

        <nav style="margin: 20px 0; padding: 15px; background-color: #f5f5f5; border-radius: 4px;">
            <h3 style="margin-top: 0;">Faction Management Tools:</h3>
            <a href="/oc-assignment" style="margin-right: 15px; padding: 8px 16px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">OC Assignment Email</a>
            <a href="/trading" style="margin-right: 15px; padding: 8px 16px; background-color: #2196F3; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Trading Dashboard</a>
            <a href="/requirements" style="margin-right: 15px; padding: 8px 16px; background-color: #ff9800; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Requirements Report</a>
        </nav>

        <div id="loading" class="loading">Loading health data...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="services" class="services-grid"></div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
