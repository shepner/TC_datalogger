<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Dashboard - Torn City Faction Management</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='auth-redirect.js') }}"></script>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
            <h1 style="margin: 0; font-size: 18px; font-weight: 600; color: #333;">Health Dashboard</h1>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="refreshBtn" class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;">Refresh</button>
                <span id="lastUpdate" class="last-update" style="font-size: 12px; color: #666;">Never updated</span>
                <a href="{{ url_for('logout') }}" style="font-size: 12px; color: #666;">Log out</a>
            </div>
        </div>

        <nav style="margin: 20px 0; padding: 15px; background-color: #f5f5f5; border-radius: 4px;">
            <h3 style="margin-top: 0;">Faction Management Tools:</h3>
            <a href="/oc-assignment" style="margin-right: 15px; padding: 8px 16px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">OC Dashboard</a>
            <a href="/trading" style="margin-right: 15px; padding: 8px 16px; background-color: #2196F3; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Trading Dashboard</a>
            <a href="/purchases" style="margin-right: 15px; padding: 8px 16px; background-color: #009688; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Purchases</a>
            <a href="/requirements" style="margin-right: 15px; padding: 8px 16px; background-color: #ff9800; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Requirements Report</a>
            <a href="/account-management" style="margin-right: 15px; padding: 8px 16px; background-color: #9b59b6; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Account Management</a>
        </nav>

        <div id="loading" class="loading">Loading health data...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="services" class="services-grid"></div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
