<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements Report - Torn City Faction Management</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        button {
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #2196F3;
        }
        button.secondary:hover {
            background-color: #0b7dda;
        }
        .table-container {
            max-height: 70vh;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid #ddd;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th, td {
            padding: 3px 6px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            border-right: 1px solid #eee;
            white-space: nowrap;
        }
        th {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        th:hover {
            background-color: #45a049;
        }
        th.sortable::after {
            content: ' ↕';
            opacity: 0.5;
            font-size: 10px;
        }
        th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        tbody tr:hover {
            background-color: #e8f5e9;
        }
        /* Stoplight color coding */
        .cell-green {
            background-color: #c8e6c9;
            font-weight: 500;
        }
        .cell-yellow {
            background-color: #fff9c4;
            font-weight: 500;
        }
        .cell-red {
            background-color: #ffcdd2;
            font-weight: 500;
        }
        .met {
            color: #2e7d32;
            font-weight: bold;
        }
        .not-met {
            color: #c62828;
            font-weight: bold;
        }
        .action-promote {
            background-color: #4CAF50;
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .action-demote {
            background-color: #ff9800;
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .action-remove {
            background-color: #f44336;
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
        }
        .action-none {
            color: #999;
        }
        /* Max Recommended OC level colors */
        .oc-level-1 { background-color: #e3f2fd; }
        .oc-level-2 { background-color: #bbdefb; }
        .oc-level-3 { background-color: #90caf9; }
        .oc-level-4 { background-color: #64b5f6; }
        .oc-level-5 { background-color: #42a5f5; }
        .oc-level-6 { background-color: #2196f3; color: white; }
        .oc-level-7 { background-color: #1e88e5; color: white; }
        .oc-level-8 { background-color: #1976d2; color: white; }
        .oc-level-9 { background-color: #1565c0; color: white; }
        .oc-level-10 { background-color: #0d47a1; color: white; }
        .summary {
            margin: 10px 0;
            padding: 8px 12px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
        }
        .summary h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .summary-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-label {
            font-weight: 500;
            color: #666;
        }
        .summary-value {
            font-weight: 600;
            color: #333;
        }
        .error {
            color: #c33;
            margin-top: 10px;
            padding: 8px;
            background-color: #fee;
            border: 1px solid #fcc;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
            <h1 style="margin: 0; font-size: 18px; font-weight: 600; color: #333;">Requirements Report</h1>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="pull-data-btn" onclick="triggerDataPull()" style="padding: 6px 12px; font-size: 12px; background-color: #2196F3; color: white; border: none; border-radius: 3px; cursor: pointer;">Pull Data from TC API</button>
                <a href="/" style="text-decoration: none; font-size: 12px; color: #666; padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px; background-color: #f5f5f5;">← Back to Dashboard</a>
            </div>
        </div>
        <div id="data-pull-status" style="display: none; margin-bottom: 10px; padding: 8px; border-radius: 4px; font-size: 12px;"></div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="summary" class="summary" style="display: none;">
            <h3>Summary</h3>
            <div id="summary-content" class="summary-content"></div>
        </div>

        <div id="report-container">
            <div class="table-container">
                <table id="report-table" style="display: none;">
                    <thead>
                        <tr>
                            <th class="sortable" data-column="member_name">Member</th>
                            <th class="sortable" data-column="level">Level</th>
                            <th class="sortable" data-column="position">Position</th>
                            <th class="sortable" data-column="days_in_faction">Days in Faction</th>
                            <th class="sortable" data-column="days_inactive">Days Inactive</th>
                            <th class="sortable" data-column="is_in_oc">In OC</th>
                            <th class="sortable" data-column="oc_count_30d">OC (30d)</th>
                            <th class="sortable" data-column="oc_count_7d">OC (7d)</th>
                            <th class="sortable" data-column="oc_requirement_met">OC Met</th>
                            <th class="sortable" data-column="trading_count_30d">Trading (30d)</th>
                            <th class="sortable" data-column="trading_requirement_met">Trading Met</th>
                            <th class="sortable" data-column="chain_participation">Chains</th>
                            <th class="sortable" data-column="all_requirements_met">All Met</th>
                            <th class="sortable" data-column="can_promote">Can Promote</th>
                            <th class="sortable" data-column="action">Action</th>
                        </tr>
                    </thead>
                    <tbody id="report-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadReport() {
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch('/api/requirements/report');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load report');
                }

                displayReport(data);
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        let currentSort = { column: null, direction: 'asc' };
        let reportData = [];

        function getCellClass(value, type) {
            if (type === 'oc_count') {
                return value >= 3 ? 'cell-green' : (value >= 1 ? 'cell-yellow' : 'cell-red');
            } else if (type === 'trading_count') {
                return value > 480 ? 'cell-green' : (value >= 240 ? 'cell-yellow' : 'cell-red');
            } else if (type === 'days_inactive') {
                return value === 0 ? 'cell-green' : (value <= 2 ? 'cell-yellow' : 'cell-red');
            } else if (type === 'days_in_faction') {
                return value >= 30 ? 'cell-green' : 'cell-yellow';
            } else if (type === 'boolean') {
                return value ? 'cell-green' : 'cell-red';
            } else if (type === 'na') {
                return 'cell-yellow';
            }
            return '';
        }

        function getOCLevelClass(level) {
            if (level >= 1 && level <= 10) {
                return `oc-level-${level}`;
            }
            return '';
        }

        function displayReport(data) {
            const report = data.report;
            const actions = data.actions;

            // Store report data for sorting
            reportData = report;

            // Display summary
            const summaryContent = document.getElementById('summary-content');
            summaryContent.innerHTML = `
                <div class="summary-item"><span class="summary-label">Promote:</span><span class="summary-value">${actions.promote.length}</span></div>
                <div class="summary-item"><span class="summary-label">Demote:</span><span class="summary-value">${actions.demote.length}</span></div>
                <div class="summary-item"><span class="summary-label">Remove:</span><span class="summary-value">${actions.remove.length}</span></div>
                <div class="summary-item"><span class="summary-label">No Action:</span><span class="summary-value">${actions.none.length}</span></div>
            `;
            document.getElementById('summary').style.display = 'block';

            // Render table
            renderTable();
            
            // Attach sort handlers
            attachSortHandlers();

            document.getElementById('report-table').style.display = 'table';
        }

        function renderTable() {
            const tbody = document.getElementById('report-body');
            tbody.innerHTML = '';

            reportData.forEach(member => {
                const row = document.createElement('tr');
                
                const ocMet = member.oc_requirement_met ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>';
                const tradingMet = member.trading_requirement_met ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>';
                const chainsMet = member.chain_participation ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>';
                const allMet = member.all_requirements_met ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>';
                const canPromote = member.can_promote ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>';
                
                const action = member.action || 'none';
                const actionClass = `action-${action}`;
                const actionDisplay = action === 'none' ? '-' : `<span class="${actionClass}">${action.toUpperCase()}</span>`;

                const ocCount = member.oc_count_30d || 0;
                const tradingCount = member.trading_count_30d || 0;
                const daysInactive = member.days_inactive || 0;
                const daysInFaction = member.days_in_faction || 0;
                const level = member.level || 0;
                
                // Handle N/A case (days_in_faction < 30)
                const isNA = daysInFaction < 30;
                const allMetDisplay = isNA ? 'N/A' : (member.all_requirements_met ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>');
                const canPromoteDisplay = isNA ? 'N/A' : (member.can_promote ? '<span class="met">✓</span>' : '<span class="not-met">✗</span>');
                const allMetClass = isNA ? getCellClass(null, 'na') : getCellClass(member.all_requirements_met, 'boolean');
                const canPromoteClass = isNA ? getCellClass(null, 'na') : getCellClass(member.can_promote, 'boolean');

                row.innerHTML = `
                    <td>${member.member_name}</td>
                    <td class="${getOCLevelClass(level)}">${level}</td>
                    <td>${member.position || '-'}</td>
                    <td class="${getCellClass(daysInFaction, 'days_in_faction')}">${daysInFaction}</td>
                    <td class="${getCellClass(daysInactive, 'days_inactive')}">${daysInactive}</td>
                    <td class="${getCellClass(member.is_in_oc, 'boolean')}">${member.is_in_oc ? '✓' : '✗'}</td>
                    <td class="${getCellClass(ocCount, 'oc_count')}">${ocCount}</td>
                    <td class="${getCellClass(member.oc_count_7d || 0, 'oc_count')}">${member.oc_count_7d || 0}</td>
                    <td class="${getCellClass(member.oc_requirement_met, 'boolean')}">${ocMet}</td>
                    <td class="${getCellClass(tradingCount, 'trading_count')}">${tradingCount}</td>
                    <td class="${getCellClass(member.trading_requirement_met, 'boolean')}">${tradingMet}</td>
                    <td class="${getCellClass(member.chain_participation, 'boolean')}">${chainsMet}</td>
                    <td class="${allMetClass}">${allMetDisplay}</td>
                    <td class="${canPromoteClass}">${canPromoteDisplay}</td>
                    <td>${actionDisplay}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            reportData.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];

                // Handle null/undefined - treat null as less than everything
                if (aVal == null && bVal == null) return 0;
                if (aVal == null) return 1;  // null sorts to end
                if (bVal == null) return -1; // null sorts to end

                // Handle booleans
                if (typeof aVal === 'boolean') {
                    aVal = aVal ? 1 : 0;
                    bVal = bVal ? 1 : 0;
                }

                // Handle strings
                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }

                // Handle numbers
                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    return currentSort.direction === 'asc' ? aVal - bVal : bVal - aVal;
                }

                let comparison = 0;
                if (aVal < bVal) comparison = -1;
                if (aVal > bVal) comparison = 1;

                return currentSort.direction === 'asc' ? comparison : -comparison;
            });

            // Update header sort indicators
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.column === column) {
                    th.classList.add(`sort-${currentSort.direction}`);
                }
            });

            renderTable();
            // Re-attach handlers after re-rendering
            attachSortHandlers();
        }

        function attachSortHandlers() {
            // Remove all existing listeners by removing and re-adding
            document.querySelectorAll('th.sortable').forEach(th => {
                // Clone to remove all event listeners
                const newTh = th.cloneNode(true);
                th.parentNode.replaceChild(newTh, th);
                
                // Add click listener
                newTh.addEventListener('click', (e) => {
                    e.preventDefault();
                    const column = newTh.dataset.column;
                    if (column) {
                        sortTable(column);
                    }
                });
            });
        }

        async function triggerDataPull() {
            const btn = document.getElementById('pull-data-btn');
            const statusDiv = document.getElementById('data-pull-status');
            
            // Disable button and show status
            btn.disabled = true;
            btn.textContent = 'Pulling Data...';
            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#fff3cd';
            statusDiv.style.color = '#856404';
            statusDiv.style.border = '1px solid #ffc107';
            
            // Only update services/tables used by the requirements report
            // - v2_faction_40832_members-raw (from faction_members)
            // - v2_faction_40832_crimes-raw (from faction_crimes)
            // - v2_torn_user_events-raw (from user_events)
            const services = ['faction_members', 'faction_crimes', 'user_events'];
            let startTime = Date.now();
            
            // Show initial status with service list
            const updateStatus = (message, showServices = false) => {
                let statusMsg = message;
                if (showServices) {
                    statusMsg += '\n\nPulling data for:\n';
                    services.forEach(s => {
                        statusMsg += `  • ${s}\n`;
                    });
                }
                statusDiv.innerHTML = statusMsg.replace(/\n/g, '<br>');
            };
            
            updateStatus('🔄 Starting data pull...', true);
            
            // Update elapsed time every second
            const timeInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const currentStatus = statusDiv.textContent || statusDiv.innerText;
                if (!currentStatus.includes('completed') && !currentStatus.includes('Error')) {
                    updateStatus(`🔄 Pulling data... (${minutes}m ${seconds}s elapsed)`, true);
                }
            }, 1000);
            
            try {
                const response = await fetch('/api/data-pull/trigger', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ services: services })
                });
                
                clearInterval(timeInterval);
                const data = await response.json();
                const totalTime = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(totalTime / 60);
                const seconds = totalTime % 60;
                
                if (data.success) {
                    statusDiv.style.backgroundColor = '#d4edda';
                    statusDiv.style.color = '#155724';
                    statusDiv.style.border = '1px solid #c3e6cb';
                    
                    const successCount = Object.values(data.results || {}).filter(r => r.success).length;
                    let successMsg = `✅ Data pull completed successfully!\n\n`;
                    successMsg += `Completed in ${minutes}m ${seconds}s\n`;
                    successMsg += `All ${successCount} services completed successfully.\n\n`;
                    successMsg += `Reloading page in 3 seconds...`;
                    statusDiv.innerHTML = successMsg.replace(/\n/g, '<br>');
                    
                    // Wait a moment, then reload the page
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else {
                    // Some services failed or were skipped - show detailed results
                    const results = data.results || {};
                    const successful = Object.entries(results).filter(([_, r]) => r.success);
                    const failed = Object.entries(results).filter(([_, r]) => !r.success && !r.error?.includes('Rate limited'));
                    const rateLimited = Object.entries(results).filter(([_, r]) => r.error?.includes('Rate limited'));
                    
                    statusDiv.style.backgroundColor = '#f8d7da';
                    statusDiv.style.color = '#721c24';
                    statusDiv.style.border = '1px solid #f5c6cb';
                    
                    let errorMsg = `⚠️ Data pull completed with issues\n\n`;
                    errorMsg += `Completed in ${minutes}m ${seconds}s\n\n`;
                    
                    if (successful.length > 0) {
                        errorMsg += `✅ Successful (${successful.length}): ${successful.map(([n]) => n.replace('_', ' ')).join(', ')}\n\n`;
                    }
                    
                    if (rateLimited.length > 0) {
                        errorMsg += `⏱️ Rate Limited (${rateLimited.length}): ${rateLimited.map(([n, r]) => {
                            const match = r.error?.match(/wait (\d+) more minute/);
                            const minutes = match ? match[1] : '?';
                            return `${n.replace('_', ' ')} (wait ${minutes} min)`;
                        }).join(', ')}\n\n`;
                    }
                    
                    if (failed.length > 0) {
                        errorMsg += `❌ Failed (${failed.length}): ${failed.map(([n]) => n.replace('_', ' ')).join(', ')}\n\n`;
                        failed.forEach(([name, result]) => {
                            errorMsg += `${name.replace('_', ' ')}: ${result.error || 'Unknown error'}\n`;
                        });
                    }
                    
                    statusDiv.innerHTML = errorMsg.replace(/\n/g, '<br>');
                    btn.disabled = false;
                    btn.textContent = 'Pull Data from TC API';
                }
            } catch (error) {
                clearInterval(timeInterval);
                statusDiv.style.backgroundColor = '#f8d7da';
                statusDiv.style.color = '#721c24';
                statusDiv.style.border = '1px solid #f5c6cb';
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                btn.disabled = false;
                btn.textContent = 'Pull Data from TC API';
            }
        }

        // Load report on page load
        window.addEventListener('DOMContentLoaded', loadReport);
    </script>
</body>
</html>
