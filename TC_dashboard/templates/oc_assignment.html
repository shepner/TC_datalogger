        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            // Get checked difficulty levels
            const checkedLevels = new Set();
            document.querySelectorAll('#oc_level_checkboxes input[type="checkbox"]:checked').forEach(cb => {
                checkedLevels.add(parseInt(cb.value, 10));
            });
            
            const memberFilterValue = document.getElementById('member_filter').value;
            let filteredData = performanceData;

            // If at least one checkbox is checked, filter by checked levels
            if (checkedLevels.size > 0) {
                filteredData = filteredData.filter(r => {
                    const ocLevel = r.oc_level || r.difficulty;
                    const ocLevelNum = typeof ocLevel === 'string' ? parseInt(ocLevel, 10) : ocLevel;
                    return checkedLevels.has(ocLevelNum);
                });
            }
            if (memberFilterValue) {
                filteredData = filteredData.filter(r => r.member_name === memberFilterValue);
            }

            filteredData.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];

                if (aVal == null && bVal == null) return 0;
                if (aVal == null) return 1;
                if (bVal == null) return -1;

                // Handle date strings
                if (column === 'executed_at') {
                    aVal = aVal ? new Date(aVal).getTime() : 0;
                    bVal = bVal ? new Date(bVal).getTime() : 0;
                }

                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    return currentSort.direction === 'asc' ? aVal - bVal : bVal - aVal;
                }

                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }

                let comparison = 0;
                if (aVal < bVal) comparison = -1;
                if (aVal > bVal) comparison = 1;

                return currentSort.direction === 'asc' ? comparison : -comparison;
            });

            // Update header sort indicators
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.column === column) {
                    th.classList.add(`sort-${currentSort.direction}`);
                    th.innerHTML = th.innerHTML.replace(/ [↑↓↕]/, '') + (currentSort.direction === 'asc' ? ' ↑' : ' ↓');
                } else {
                    th.innerHTML = th.innerHTML.replace(/ [↑↓]/, '') + ' ↕';
                }
            });

                else if (progress >= 80) progressClass = 'cell-yellow';
                else progressClass = 'cell-red';

                row.innerHTML = `
                    <td style="padding: 2px 4px; border: 1px solid #ddd; position: sticky; left: 0; background-color: white; font-weight: bold;">${record.member_name || 'Unknown'}</td>
                    <td style="padding: 2px 4px; border: 1px solid #ddd; text-align: center;">${record.oc_level || '-'}</td>
                    <td style="padding: 2px 4px; border: 1px solid #ddd;">${record.oc_name || '-'}</td>
                    <td style="padding: 2px 4px; border: 1px solid #ddd;">${record.position || '-'}</td>

                    <td class="${progressClass}" style="padding: 2px 4px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${progress.toFixed(1)}%</td>

                    <td style="padding: 2px 4px; border: 1px solid #ddd; text-align: center;">${checkpointRate}</td>

            const aggregated = window.aggregatedData && window.aggregatedData[member.member_name] 
                ? window.aggregatedData[member.member_name].oc_ranges 
                : {};
            
            // Get all OC names for this difficulty level
            const ocKeys = Object.keys(aggregated).filter(key => key.startsWith(`${difficulty}_`));
            
            ocKeys.forEach(ocKey => {
                const ocName = ocKey.replace(`${difficulty}_`, '');
                const ocData = aggregated[ocKey];
                if (ocData && ocData.range) {
                    summaryData.push({
                        ocName: ocName,
                        range: ocData.range,
                        min: ocData.min,
                        max: ocData.max,
                        values: ocData.values || []
                    });
                }
            });
            
            return summaryData.sort((a, b) => a.ocName.localeCompare(b.ocName));
        }
        
        function collectOCSummaryData(member, difficulty, ocName) {
            // Collect position-level data for this OC
            const summaryData = [];
            
            // Get all position histories for this OC
            const prefix = `${difficulty}_${ocName}_`;
            member.history.forEach((history, columnKey) => {
                if (columnKey.startsWith(prefix)) {
                    const positionId = columnKey.replace(prefix, '');
                    if (history && history.length > 0) {
                        // Calculate range for this position
                        const rates = history.map(r => r.checkpoint_pass_rate || 0);
                        const min = Math.min(...rates);
                        const max = Math.max(...rates);
                        const range = min === max ? min.toString() : `${min}-${max}`;
                        
                        // Get position name from first record
                        const positionName = history[0].position || positionId;
                        
                        summaryData.push({
                            positionId: positionId,
                            positionName: positionName,
                            range: range,
                            min: min,
                            max: max,
                            history: history
                        });
                    }
                }
            });
            
            return summaryData.sort((a, b) => a.positionId.localeCompare(b.positionId));
        }
        
        function collectAllLevelData(member, difficulty) {
            // Collect ALL detailed data for this level (all OCs, all positions)
            const allData = [];
            
            member.history.forEach((history, columnKey) => {
                if (columnKey.startsWith(`${difficulty}_`)) {
                    // Parse column key: difficulty_ocName_positionId
                    const parts = columnKey.split('_');
                    if (parts.length >= 3) {
                        const ocName = parts.slice(1, -1).join('_'); // Handle OC names with underscores
                        const positionId = parts[parts.length - 1];
                        
                        if (history && history.length > 0) {
                            history.forEach(record => {
                                allData.push({
                                    ...record,
                                    ocName: ocName,
                                    positionId: positionId,
                                    position: record.position || positionId
                                });
                            });
                        }
                    }
                }
            });
            
            // Sort by executed_at (most recent first)
            return allData.sort((a, b) => {
                const dateA = a.executed_at ? new Date(a.executed_at).getTime() : 0;
                const dateB = b.executed_at ? new Date(b.executed_at).getTime() : 0;
                return dateB - dateA;
            });
        }
        
        function collectAllOCData(member, difficulty, ocName) {
            // Collect ALL detailed data for this OC (all positions)
            const allData = [];
            const prefix = `${difficulty}_${ocName}_`;
            
            member.history.forEach((history, columnKey) => {
                if (columnKey.startsWith(prefix)) {
                    const positionId = columnKey.replace(prefix, '');
                    if (history && history.length > 0) {
                        history.forEach(record => {
                            allData.push({
                                ...record,
                                ocName: ocName, // Ensure OC name is set
                                positionId: positionId,
                                position: record.position || positionId
                            });
                        });
                    }
                }
            });
            
            // Sort by executed_at (most recent first)
            return allData.sort((a, b) => {
                const dateA = a.executed_at ? new Date(a.executed_at).getTime() : 0;
                const dateB = b.executed_at ? new Date(b.executed_at).getTime() : 0;
                return dateB - dateA;
            });
        }
        
        // Summary Tooltip Functions
        function showSummaryTooltip(cell, summaryData, difficulty, ocName, summaryType) {
            hideHistoryTooltip();
            
            if (!summaryData || summaryData.length === 0) {
                console.log('No summary data available');
                return;
            }
            
            const tooltip = document.createElement('div');
            tooltip.className = 'history-tooltip';
            tooltip.id = 'history-tooltip-popup';
            tooltip.style.display = 'block';
            tooltip.style.visibility = 'visible';
            tooltip.style.opacity = '1';
            
            let html = '';
            if (summaryType === 'level') {
                html = `<div style="font-weight: bold; margin-bottom: 8px; color: #4CAF50;">Level ${difficulty} - OC Summaries</div>`;
                html += `<table>`;
                html += `<thead><tr><th style="padding: 4px 6px;">OC Name</th><th style="padding: 4px 6px; text-align: center;">Range</th></tr></thead><tbody>`;
                
                summaryData.forEach(item => {
                    const hasIssue = item.values && item.values.some(v => v < 80 || v > 90);
                    const rowClass = hasIssue ? 'cell-red' : '';
                    html += `<tr class="${rowClass}">`;
                    html += `<td style="padding: 4px 6px;">${item.ocName}</td>`;
                    html += `<td style="padding: 4px 6px; text-align: center; font-weight: bold;">${item.range}</td>`;
                    html += `</tr>`;
                });
            } else if (summaryType === 'oc') {
                html = `<div style="font-weight: bold; margin-bottom: 8px; color: #4CAF50;">Level ${difficulty} ${ocName} - Position Summaries</div>`;
                html += `<table>`;
                html += `<thead><tr><th style="padding: 4px 6px;">Position</th><th style="padding: 4px 6px; text-align: center;">Range</th></tr></thead><tbody>`;
                
                summaryData.forEach(item => {
                    const hasIssue = item.values && item.values.some(v => v < 80 || v > 90);
                    const rowClass = hasIssue ? 'cell-red' : '';
                    html += `<tr class="${rowClass}">`;
                    html += `<td style="padding: 4px 6px;">${item.positionName} (${item.positionId})</td>`;
                    html += `<td style="padding: 4px 6px; text-align: center; font-weight: bold;">${item.range}</td>`;
                    html += `</tr>`;
                });
            }
            
            html += `</tbody></table>`;
            html += `<div style="margin-top: 8px; font-size: 11px; color: #666;">Click for full details</div>`;
            html += `</div>`;
            
            tooltip.innerHTML = html;
            document.body.appendChild(tooltip);
            
            // Position tooltip
            const rect = cell.getBoundingClientRect();
            let left = rect.right + 10;
            let top = rect.top;
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            
            setTimeout(() => {
                const tooltipRect = tooltip.getBoundingClientRect();
                if (left + tooltipRect.width > window.innerWidth) {
                    left = rect.left - tooltipRect.width - 10;
                }
                if (left < 0) left = 10;
                if (top + tooltipRect.height > window.innerHeight) {
                    top = window.innerHeight - tooltipRect.height - 10;
                }
                if (top < 0) top = 10;
                
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            }, 10);
            
            currentTooltip = tooltip;
        }
        
        // Summary Modal Functions
        function showSummaryModal(memberName, difficulty, ocName, summaryType, allData) {
            hideHistoryTooltip();
            const modal = document.getElementById('historyModal');
            const title = document.getElementById('historyModalTitle');
            const content = document.getElementById('historyModalContent');
            
            if (summaryType === 'level') {
                title.textContent = `Full Historical Data: ${memberName} - Level ${difficulty} (All OCs)`;
            } else if (summaryType === 'oc') {
                title.textContent = `Full Historical Data: ${memberName} - Level ${difficulty} ${ocName} (All Positions)`;
                // For OC summary, we can optionally hide the OC Name column since all rows are the same OC
                // But we'll keep it for consistency and set it properly
            }
            
            // Sort data: group by OC name first, then date descending within each OC name group
            const sortedData = [...allData].sort((a, b) => {
                // First sort by OC name (ascending) to group all records for the same OC together
                const ocNameA = (a.ocName || (summaryType === 'oc' ? ocName : null) || a.oc_name || '').toLowerCase();
                const ocNameB = (b.ocName || (summaryType === 'oc' ? ocName : null) || b.oc_name || '').toLowerCase();
                const ocCompare = ocNameA.localeCompare(ocNameB);
                if (ocCompare !== 0) {
                    return ocCompare;
                }
                
                // If same OC name, sort by date (descending - most recent first)
                const dateA = a.executed_at ? new Date(a.executed_at).getTime() : 0;
                const dateB = b.executed_at ? new Date(b.executed_at).getTime() : 0;
                if (dateB !== dateA) {
                    return dateB - dateA; // Descending
                }
                
                // If same OC name and same timestamp, sort by position for consistency
                const posA = (a.position || a.positionId || '').toLowerCase();
                const posB = (b.position || b.positionId || '').toLowerCase();
                return posA.localeCompare(posB);
            });
            
            let html = `<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">`;
            html += `<thead><tr style="background-color: #4CAF50; color: white;">`;
            html += `<th style="padding: 10px; text-align: left; border: 1px solid #ddd;">OC Name</th>`;
            html += `<th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Position</th>`;
            html += `<th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Date</th>`;
            html += `<th style="padding: 10px; text-align: center; border: 1px solid #ddd;">Checkpoint Rate</th>`;
            html += `<th style="padding: 10px; text-align: center; border: 1px solid #ddd;">Status</th>`;
            html += `<th style="padding: 10px; text-align: center; border: 1px solid #ddd;">OC ID</th>`;
            html += `</tr></thead><tbody>`;
            
            if (sortedData.length === 0) {
                html += `<tr><td colspan="6" style="padding: 20px; text-align: center; color: #999;">No historical data available</td></tr>`;
            } else {
                sortedData.forEach((record) => {
                    const dateStr = record.executed_at ? new Date(record.executed_at).toLocaleString() : 'Unknown';
                    const rate = record.checkpoint_pass_rate || 0;
                    const rateClass = (rate < 80 || rate > 90) ? 'cell-red' : '';
                    let status = record.status;
                    if (!status && record.outcome) {
                        status = record.outcome === 'Successful' ? 'Success' : 'Failure';
                    }
                    if (!status) status = 'Unknown';
                    let crimeId = record.crime_id;
                    if (!crimeId && record.id) crimeId = record.id;
                    
                    html += `<tr>`;
                    // For OC summary type, use the ocName parameter if record.ocName is missing
                    const displayOCName = record.ocName || (summaryType === 'oc' ? ocName : null) || record.oc_name || '-';
                    html += `<td style="padding: 10px; border: 1px solid #ddd;">${displayOCName}</td>`;
                    html += `<td style="padding: 10px; border: 1px solid #ddd;">${record.position || record.positionId || '-'}</td>`;
                    html += `<td style="padding: 10px; border: 1px solid #ddd;">${dateStr}</td>`;
                    html += `<td class="${rateClass}" style="padding: 10px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${rate}</td>`;
                    html += `<td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${status}</td>`;
                    if (crimeId) {
                        html += `<td style="padding: 10px; border: 1px solid #ddd; text-align: center;"><a href="https://www.torn.com/factions.php?step=your#/tab=crimes&crimeId=${crimeId}" target="_blank" style="color: #4CAF50; text-decoration: none;">${crimeId}</a></td>`;
                    } else {
                        html += `<td style="padding: 10px; border: 1px solid #ddd; text-align: center;">—</td>`;
                    }
                    html += `</tr>`;
                });
            }
            
            html += `</tbody></table>`;
            content.innerHTML = html;
            modal.style.display = 'block';
        }
        
        // History Modal Functions
        function showHistoryModal(memberName, columnKey, difficulty, ocName, positionId, positionName, history) {
            // Hide tooltip when opening modal
            hideHistoryTooltip();
            const modal = document.getElementById('historyModal');
            const title = document.getElementById('historyModalTitle');
            const content = document.getElementById('historyModalContent');
            
            title.textContent = `Historical Data: ${memberName} - Level ${difficulty} ${ocName} (${positionName})`;
            
            // Sort history by executed_at (most recent first)
            const sortedHistory = [...history].sort((a, b) => {
                const dateA = a.executed_at ? new Date(a.executed_at) : new Date(0);
                const dateB = b.executed_at ? new Date(b.executed_at) : new Date(0);
                return dateB - dateA;
            });
            
            let html = `<table style="width: 100%; border-collapse: collapse; margin-top: 10px;">`;
            html += `<thead><tr style="background-color: #4CAF50; color: white;">`;
            html += `<th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Date</th>`;
            html += `<th style="padding: 10px; text-align: center; border: 1px solid #ddd;">Checkpoint Rate</th>`;
            html += `<th style="padding: 10px; text-align: center; border: 1px solid #ddd;">Status</th>`;
            html += `<th style="padding: 10px; text-align: center; border: 1px solid #ddd;">OC ID</th>`;
            html += `</tr></thead><tbody>`;
            
            if (sortedHistory.length === 0) {
                html += `<tr><td colspan="4" style="padding: 20px; text-align: center; color: #999;">No historical data available</td></tr>`;
            } else {
                sortedHistory.forEach((record, index) => {
                    const dateStr = record.executed_at ? new Date(record.executed_at).toLocaleString() : 'Unknown';
                    const rate = record.checkpoint_pass_rate || 0;
                    const rateClass = (rate < 80 || rate > 90) ? 'cell-red' : '';
                    // Get status - handle both 'status' and 'outcome' fields
                    let status = record.status;
                    if (!status && record.outcome) {
                        status = record.outcome === 'Successful' ? 'Success' : 'Failure';
                    }
                    if (!status) {
                        status = 'Unknown';
                    }
                    // Get crime_id - handle multiple possible field names
                    let crimeId = record.crime_id;
                    if (!crimeId && record.id) {
                        crimeId = record.id;
                    }
                    // Debug: Log if crime_id is missing
                    if (!crimeId && index === 0) {
                        console.log('Missing crime_id in modal for', memberName, columnKey);
                        console.log('  Record keys:', Object.keys(record));
                        console.log('  Full record:', JSON.stringify(record, null, 2));
                    }
                    
                    // Format OC ID as link if available, otherwise show dash
                    let ocIdCell;
                    if (crimeId) {
                        const ocUrl = `https://www.torn.com/factions.php?step=your#/tab=crimes&crimeId=${crimeId}`;
                        ocIdCell = `<a href="${ocUrl}" target="_blank" style="color: #4CAF50; text-decoration: none; font-weight: bold;">${crimeId}</a>`;
                    } else {
                        ocIdCell = '—';
                    }
                    
                    html += `<tr style="background-color: ${index % 2 === 0 ? '#f9f9f9' : 'white'};">`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd;">${dateStr}</td>`;
                    html += `<td class="${rateClass}" style="padding: 8px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${rate}</td>`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd; text-align: center;">${status}</td>`;
                    html += `<td style="padding: 8px; border: 1px solid #ddd; text-align: center; font-family: monospace; font-size: 0.9em;">${ocIdCell}</td>`;
                    html += `</tr>`;
                });
            }
            
            html += `</tbody></table>`;
            html += `<div style="margin-top: 15px; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">`;
            html += `<strong>Total Attempts:</strong> ${sortedHistory.length}`;
            if (sortedHistory.length > 0) {
                const rates = sortedHistory.map(r => r.checkpoint_pass_rate || 0);
                const avgRate = (rates.reduce((a, b) => a + b, 0) / rates.length).toFixed(2);
                const minRate = Math.min(...rates);
                const maxRate = Math.max(...rates);
                html += ` | <strong>Average:</strong> ${avgRate}% | <strong>Min:</strong> ${minRate}% | <strong>Max:</strong> ${maxRate}%`;
            }
            html += `</div>`;
            
            content.innerHTML = html;
            modal.style.display = 'block';
        }
        
        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = 'none';
        }
        
        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target === modal) {
                closeHistoryModal();
            }
        }
        
        // Close modal with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeHistoryModal();
            }
        });

        // Load performance data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadPerformance();
        });
    </script>
