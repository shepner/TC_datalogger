<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Assignment Email Generator - Torn City Faction Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
        }
        textarea {
            min-height: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #2196F3;
        }
        button.secondary:hover {
            background-color: #0b7dda;
        }
        .email-output {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .copy-button {
            margin-top: 10px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        /* Pivot table header styling */
        #pivot-table {
            border-collapse: collapse;
            border-spacing: 0;
        }
        #pivot-header th {
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        }
        #pivot-header th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        #pivot-header th.sortable:hover {
            background-color: #45a049;
        }
        #pivot-header th.sortable::after {
            content: ' ↕';
            opacity: 0.5;
            font-size: 10px;
        }
        #pivot-header th.sort-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        #pivot-header th.sort-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        #pivot-header th.sort-multi::after {
            content: ' ↕';
            opacity: 0.7;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OC Assignment Email Generator</h1>
            <p>Generate email text for OC assignments with member prioritization</p>
        </header>

        <div class="form-group">
            <label for="instructions">Custom Instructions (optional):</label>
            <textarea id="instructions" placeholder="Please join the OC assigned to you below. Make sure you have the required items if needed."></textarea>
        </div>

        <div class="form-group">
            <label for="max_members">Max Members per OC:</label>
            <input type="number" id="max_members" value="1" min="1" max="10">
        </div>

        <button onclick="generateEmail()">Generate Email</button>
        <a href="/"><button class="secondary">Back to Dashboard</button></a>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <div id="email-output" class="email-output" style="display: none;">
            <h3>Generated Email:</h3>
            <textarea id="email-text" readonly></textarea>
            <button class="copy-button" onclick="copyEmail()">Copy to Clipboard</button>
        </div>

            <div style="margin-top: 40px; border-top: 2px solid #ddd; padding-top: 20px;">
            <h2 style="margin-bottom: 10px;">OC Performance Dashboard</h2>
            
            <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 15px;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <label for="performance_days" style="margin: 0; white-space: nowrap;">Days Back:</label>
                    <input type="number" id="performance_days" value="90" min="7" max="365" step="1" style="width: 70px; padding: 4px;" onchange="validateDaysBack()">
                </div>
                <button onclick="loadPerformance()" style="padding: 6px 12px; font-size: 13px;">Load Performance Data</button>
                <div id="view-controls" style="display: none; flex-direction: row; align-items: center; gap: 8px;">
                    <label style="margin: 0; white-space: nowrap;">
                        <input type="radio" name="view_mode" value="pivot" checked onchange="toggleView()" style="margin-right: 4px;"> Pivot
                    </label>
                    <label style="margin: 0; white-space: nowrap;">
                        <input type="radio" name="view_mode" value="detail" onchange="toggleView()" style="margin-right: 4px;"> Detail
                    </label>
                </div>
                <div id="filter-controls" style="display: none; flex-direction: row; align-items: center; gap: 5px;">
                    <label for="oc_level_filter" style="margin: 0; white-space: nowrap;">Level:</label>
                    <select id="oc_level_filter" onchange="toggleView()" style="padding: 4px 8px; font-size: 13px;">
                        <option value="">All</option>
                    </select>
                </div>
            </div>

            <div id="performance-container" style="display: none; margin-top: 10px;">

                <!-- Pivot View -->
                <div id="pivot-container">
                    <div style="max-height: 70vh; overflow-y: auto; overflow-x: auto; border: 1px solid #ddd; margin-top: 20px;">
                        <table id="pivot-table" style="width: 100%; border-collapse: collapse; border-spacing: 0; font-size: 12px;">
                            <thead id="pivot-header" style="position: sticky; top: 0; background-color: #4CAF50; color: white; z-index: 10;">
                            </thead>
                            <tbody id="pivot-body">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Detail View -->
                <div id="detail-container" style="display: none;">
                    <div style="max-height: 70vh; overflow-y: auto; overflow-x: auto; border: 1px solid #ddd; margin-top: 20px;">
                        <table id="performance-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
                            <thead style="position: sticky; top: 0; background-color: #4CAF50; color: white; z-index: 10;">
                                <tr>
                                    <th class="sortable" data-column="member_name" style="padding: 8px; border: 1px solid #ddd; cursor: pointer; position: sticky; left: 0; z-index: 11;">Member ↕</th>
                                    <th class="sortable" data-column="oc_level" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">OC Level ↕</th>
                                    <th class="sortable" data-column="oc_name" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">OC Name ↕</th>
                                    <th class="sortable" data-column="position" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">Position ↕</th>
                                    <th class="sortable" data-column="position_id" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">Position ID ↕</th>
                                    <th class="sortable" data-column="executed_at" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">Date ↕</th>
                                    <th class="sortable" data-column="progress" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">Probability ↕</th>
                                    <th class="sortable" data-column="outcome" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">Outcome ↕</th>
                                    <th class="sortable" data-column="checkpoint_pass_rate" style="padding: 8px; border: 1px solid #ddd; cursor: pointer;">Checkpoint Rate ↕</th>
                                </tr>
                            </thead>
                            <tbody id="performance-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateEmail() {
            const instructions = document.getElementById('instructions').value;
            const maxMembers = parseInt(document.getElementById('max_members').value);
            
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('email-output').style.display = 'none';

            try {
                const response = await fetch('/api/oc-assignment/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        instructions: instructions || null,
                        max_members_per_oc: maxMembers
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate email');
                }

                document.getElementById('email-text').value = data.email_text;
                document.getElementById('email-output').style.display = 'block';
                document.getElementById('success').textContent = 'Email generated successfully!';
                document.getElementById('success').style.display = 'block';
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function copyEmail() {
            const emailText = document.getElementById('email-text');
            emailText.select();
            emailText.setSelectionRange(0, 99999); // For mobile devices
            document.execCommand('copy');
            
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            setTimeout(() => {
                button.textContent = originalText;
            }, 2000);
        }

        function validateDaysBack() {
            const input = document.getElementById('performance_days');
            let value = parseInt(input.value, 10);
            
            if (isNaN(value) || value < 7) {
                value = 7;
            } else if (value > 365) {
                value = 365;
            }
            
            input.value = value;
        }

        async function loadPerformance() {
            const input = document.getElementById('performance_days');
            let daysBack = parseInt(input.value, 10);
            
            // Validate and clamp the value
            if (isNaN(daysBack) || daysBack < 7) {
                daysBack = 7;
                input.value = 7;
            } else if (daysBack > 365) {
                daysBack = 365;
                input.value = 365;
            }
            
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch(`/api/oc-assignment/performance?days_back=${daysBack}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load performance data');
                }

                displayPerformance(data.performance);
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        let performanceData = [];
        let currentSorts = []; // Array of { column: index, direction: 'asc'|'desc', type: 'difficulty'|'oc_name'|'position_id' }
        let historyData = new Map(); // Store history for each member/OC/position combination
        let pivotColumnMap = new Map(); // Map column index to column key (difficulty_oc_name_position_id)
        let pivotRows = []; // Store row data for sorting
        let pivotHeaderMetadata = []; // Store metadata for each column: { difficulty, oc_name, position_id, columnIndex }

        function toggleView() {
            const viewMode = document.querySelector('input[name="view_mode"]:checked').value;
            if (viewMode === 'pivot') {
                document.getElementById('pivot-container').style.display = 'block';
                document.getElementById('detail-container').style.display = 'none';
                displayPivotView(performanceData);
            } else {
                document.getElementById('pivot-container').style.display = 'none';
                document.getElementById('detail-container').style.display = 'block';
                displayDetailView(performanceData);
            }
        }

        function populateOCLevelFilter(data) {
            // Extract unique difficulty levels from the data
            const difficulties = new Set();
            data.forEach(record => {
                // Check both 'difficulty' and 'oc_level' field names
                const difficulty = record.difficulty !== undefined ? record.difficulty : record.oc_level;
                if (difficulty !== undefined && difficulty !== null && !isNaN(difficulty)) {
                    difficulties.add(parseInt(difficulty, 10));
                }
            });
            
            // Sort difficulties in descending order (highest first)
            const sortedDifficulties = Array.from(difficulties).sort((a, b) => b - a);
            
            // Populate the filter dropdown
            const filterSelect = document.getElementById('oc_level_filter');
            const currentValue = filterSelect.value; // Preserve current selection
            
            // Clear existing options except "All"
            filterSelect.innerHTML = '<option value="">All</option>';
            
            // Add options for each available difficulty level
            sortedDifficulties.forEach(difficulty => {
                const option = document.createElement('option');
                option.value = difficulty;
                option.textContent = `Level ${difficulty}`;
                filterSelect.appendChild(option);
            });
            
            // Restore previous selection if it still exists
            if (currentValue && sortedDifficulties.includes(parseInt(currentValue, 10))) {
                filterSelect.value = currentValue;
            } else {
                filterSelect.value = ''; // Reset to "All" if previous selection no longer exists
            }
        }

        function displayPerformance(performance) {
            performanceData = performance || [];
            currentSorts = []; // Reset sorts when loading new data
            
            // Populate OC Level Filter based on available data
            populateOCLevelFilter(performanceData);
            
            // Build history data map
            historyData.clear();
            performanceData.forEach(record => {
                const key = `${record.member_name}_${record.oc_name}_${record.position_id}`;
                if (!historyData.has(key)) {
                    historyData.set(key, []);
                }
                historyData.get(key).push(record);
            });
            
            // Sort history by date (most recent first)
            historyData.forEach((records, key) => {
                records.sort((a, b) => {
                    const dateA = a.executed_at ? new Date(a.executed_at).getTime() : 0;
                    const dateB = b.executed_at ? new Date(b.executed_at).getTime() : 0;
                    return dateB - dateA;
                });
            });
            
            // Show view and filter controls
            const viewControls = document.getElementById('view-controls');
            const filterControls = document.getElementById('filter-controls');
            viewControls.style.display = 'flex';
            filterControls.style.display = 'flex';
            
            toggleView();
            document.getElementById('performance-container').style.display = 'block';
        }

        function displayPivotView(data) {
            const ocLevelFilter = document.getElementById('oc_level_filter').value;
            let filteredData = data;
            if (ocLevelFilter) {
                // Convert filter to number for comparison
                const filterNum = parseInt(ocLevelFilter, 10);
                filteredData = data.filter(r => {
                    const diff = r.difficulty !== undefined ? r.difficulty : r.oc_level;
                    // Handle both string and number types
                    if (typeof diff === 'string') {
                        return parseInt(diff, 10) === filterNum;
                    }
                    return diff === filterNum;
                });
            }

            if (filteredData.length === 0) {
                document.getElementById('pivot-body').innerHTML = '<tr><td colspan="100" style="padding: 20px; text-align: center;">No performance data found</td></tr>';
                return;
            }

            // Debug: Check first record structure
            if (filteredData.length > 0 && filteredData[0]) {
                console.log('First record:', filteredData[0]);
                console.log('Difficulty value:', filteredData[0].difficulty, 'Type:', typeof filteredData[0].difficulty);
            }

            // Build hierarchical column structure: difficulty -> oc_name -> position_id
            // Group data by difficulty -> oc_name -> position_id
            const columnGroups = new Map(); // key: difficulty, value: Map of oc_name -> Map of position_id -> {position, position_id}
            const members = new Map(); // key: member_name, value: {member_name, data: Map of "difficulty_oc_name_position_id" -> max checkpoint_pass_rate}

            filteredData.forEach(record => {
                // Get difficulty - check both 'difficulty' and 'oc_level' field names
                let difficulty = record.difficulty !== undefined ? record.difficulty : record.oc_level;
                
                // Skip records with null/undefined difficulty
                if (difficulty === undefined || difficulty === null) {
                    console.warn('Skipping record with missing difficulty:', record);
                    return; // Skip this record
                }
                
                // Convert to number if it's a string
                if (typeof difficulty === 'string') {
                    difficulty = parseInt(difficulty, 10);
                    if (isNaN(difficulty)) {
                        console.warn('Skipping record with invalid difficulty value:', record.difficulty, 'in record:', record);
                        return; // Skip this record
                    }
                }
                
                // Ensure it's a valid number (1-6, or higher if needed)
                if (typeof difficulty !== 'number' || difficulty < 1) {
                    console.warn('Skipping record with invalid difficulty:', difficulty, 'in record:', record);
                    return; // Skip this record
                }
                
                // Build column key for member data
                const columnKey = `${difficulty}_${record.oc_name}_${record.position_id}`;
                
                // Build hierarchical column structure
                if (!columnGroups.has(difficulty)) {
                    columnGroups.set(difficulty, new Map());
                }
                const difficultyGroup = columnGroups.get(difficulty);
                if (!difficultyGroup.has(record.oc_name)) {
                    difficultyGroup.set(record.oc_name, new Map());
                }
                const ocGroup = difficultyGroup.get(record.oc_name);
                if (!ocGroup.has(record.position_id)) {
                    ocGroup.set(record.position_id, {
                        position: record.position,
                        position_id: record.position_id
                    });
                }

                // Store member data - keep MAX checkpoint_pass_rate
                if (!members.has(record.member_name)) {
                    members.set(record.member_name, {
                        member_name: record.member_name,
                        data: new Map()
                    });
                }
                const memberData = members.get(record.member_name);
                const currentMax = memberData.data.get(columnKey);
                const checkpointRate = record.checkpoint_pass_rate || 0;
                if (!currentMax || checkpointRate > currentMax) {
                    memberData.data.set(columnKey, checkpointRate);
                }
            });

            // Check if we have any valid data after filtering
            if (columnGroups.size === 0) {
                document.getElementById('pivot-body').innerHTML = '<tr><td colspan="100" style="padding: 20px; text-align: center;">No performance data found (all records may have been filtered out due to missing difficulty values).</td></tr>';
                return;
            }

            // Build header with hierarchical structure
            const header = document.getElementById('pivot-header');
            header.innerHTML = '';
            
            // First row: difficulty headers (with colspan) - sortable
            const headerRow1 = document.createElement('tr');
            headerRow1.innerHTML = '<th rowspan="3" class="sortable" data-column="member" data-type="member" style="padding: 8px; position: sticky; left: 0; background-color: #4CAF50; z-index: 11; text-align: left; cursor: pointer;">Member</th>';
            
            const sortedDifficulties = Array.from(columnGroups.keys()).filter(d => d != null && typeof d === 'number').sort((a, b) => {
                return b - a; // Higher difficulty first
            });
            pivotHeaderMetadata = []; // Reset metadata
            let columnIndex = 1; // Start at 1 (0 is Member)
            sortedDifficulties.forEach(difficulty => {
                const difficultyGroup = columnGroups.get(difficulty);
                let totalCols = 0;
                const startColIndex = columnIndex;
                difficultyGroup.forEach(ocGroup => {
                    totalCols += ocGroup.size;
                });
                if (totalCols > 0) {
                    headerRow1.innerHTML += `<th class="sortable" data-column="${startColIndex}" data-type="difficulty" data-difficulty="${difficulty}" colspan="${totalCols}" style="padding: 8px; text-align: center; background-color: #4CAF50; color: white; cursor: pointer;">Level ${difficulty}</th>`;
                    // Store metadata for all columns in this difficulty group
                    difficultyGroup.forEach((ocGroup, ocName) => {
                        const sortedPositionIds = Array.from(ocGroup.keys()).sort();
                        sortedPositionIds.forEach(positionId => {
                            pivotHeaderMetadata.push({
                                difficulty: difficulty,
                                oc_name: ocName,
                                position_id: positionId,
                                columnIndex: columnIndex
                            });
                            columnIndex++;
                        });
                    });
                }
            });
            header.appendChild(headerRow1);

            // Second row: oc_name headers (with colspan for position_ids) - sortable
            const headerRow2 = document.createElement('tr');
            columnIndex = 1;
            sortedDifficulties.forEach(difficulty => {
                const difficultyGroup = columnGroups.get(difficulty);
                const sortedOCNames = Array.from(difficultyGroup.keys()).sort();
                sortedOCNames.forEach(ocName => {
                    const ocGroup = difficultyGroup.get(ocName);
                    const sortedPositionIds = Array.from(ocGroup.keys()).sort();
                    const startColIndex = columnIndex;
                    headerRow2.innerHTML += `<th class="sortable" data-column="${startColIndex}" data-type="oc_name" data-difficulty="${difficulty}" data-oc-name="${ocName.replace(/"/g, '&quot;')}" colspan="${sortedPositionIds.length}" style="padding: 8px; text-align: center; background-color: #4CAF50; color: white; cursor: pointer;">${ocName}</th>`;
                    columnIndex += sortedPositionIds.length;
                });
            });
            header.appendChild(headerRow2);

            // Third row: position_id headers (sortable)
            const headerRow3 = document.createElement('tr');
            pivotColumnMap.clear(); // Reset column map
            columnIndex = 1; // Track column index (0 is Member column, so start at 1)
            sortedDifficulties.forEach(difficulty => {
                const difficultyGroup = columnGroups.get(difficulty);
                const sortedOCNames = Array.from(difficultyGroup.keys()).sort();
                sortedOCNames.forEach(ocName => {
                    const ocGroup = difficultyGroup.get(ocName);
                    const sortedPositionIds = Array.from(ocGroup.keys()).sort();
                    sortedPositionIds.forEach(positionId => {
                        const posInfo = ocGroup.get(positionId);
                        const columnKey = `${difficulty}_${ocName}_${positionId}`;
                        pivotColumnMap.set(columnIndex, columnKey);
                        headerRow3.innerHTML += `<th class="sortable" data-column="${columnIndex}" data-type="position_id" data-difficulty="${difficulty}" data-oc-name="${ocName.replace(/"/g, '&quot;')}" data-position-id="${positionId}" style="padding: 8px; text-align: center; background-color: #4CAF50; color: white; cursor: pointer;">${positionId}</th>`;
                        columnIndex++;
                    });
                });
            });
            header.appendChild(headerRow3);
            
            // Attach sort handlers to all sortable headers
            attachPivotSortHandlers();

            // Build body
            const tbody = document.getElementById('pivot-body');
            tbody.innerHTML = '';
            pivotRows = []; // Reset row data

            // Sort members by name
            const sortedMembers = Array.from(members.values()).sort((a, b) => 
                a.member_name.localeCompare(b.member_name)
            );

            sortedMembers.forEach(member => {
                const row = document.createElement('tr');
                const rowData = { member_name: member.member_name, cells: [] };
                row.innerHTML = `<td style="padding: 6px; border: 1px solid #ddd; border-right: 1px solid #ddd; position: sticky; left: 0; background-color: white; font-weight: bold;">${member.member_name}</td>`;
                
                sortedDifficulties.forEach(difficulty => {
                    const difficultyGroup = columnGroups.get(difficulty);
                    const sortedOCNames = Array.from(difficultyGroup.keys()).sort();
                    sortedOCNames.forEach(ocName => {
                        const ocGroup = difficultyGroup.get(ocName);
                        const sortedPositionIds = Array.from(ocGroup.keys()).sort();
                        sortedPositionIds.forEach(positionId => {
                            const columnKey = `${difficulty}_${ocName}_${positionId}`;
                            const checkpointRate = member.data.get(columnKey);
                            
                            // Store cell value for sorting
                            rowData.cells.push(checkpointRate !== undefined ? checkpointRate : null);
                            
                            if (checkpointRate !== undefined) {
                                // Color coding: red for < 80 or > 90, no color for 80-90 range
                                let cellClass = '';
                                if (checkpointRate < 80 || checkpointRate > 90) {
                                    cellClass = 'cell-red';
                                }
                                
                                row.innerHTML += `<td class="${cellClass}" style="padding: 6px; border: 1px solid #ddd; border-right: 1px solid #ddd; text-align: center; font-weight: bold;">${checkpointRate}</td>`;
                            } else {
                                row.innerHTML += '<td style="padding: 6px; border: 1px solid #ddd; border-right: 1px solid #ddd; text-align: center; color: #ccc;">—</td>';
                            }
                        });
                    });
                });
                
                pivotRows.push(rowData);
                tbody.appendChild(row);
            });
        }
        
        function attachPivotSortHandlers() {
            // Remove all existing listeners by removing and re-adding
            document.querySelectorAll('#pivot-header th.sortable').forEach(th => {
                // Clone to remove all event listeners
                const newTh = th.cloneNode(true);
                th.parentNode.replaceChild(newTh, th);
                
                // Add click listener
                newTh.addEventListener('click', (e) => {
                    e.preventDefault();
                    const columnIndex = newTh.dataset.column;
                    const sortType = newTh.dataset.type;
                    const isShiftClick = e.shiftKey;
                    sortPivotTable(columnIndex, sortType, isShiftClick, newTh);
                });
            });
        }
        
        function sortPivotTable(columnIndex, sortType, isShiftClick, clickedTh) {
            // Find existing sort for this column
            const existingSortIndex = currentSorts.findIndex(s => s.column === columnIndex && s.type === sortType);
            
            if (isShiftClick) {
                // Multi-sort: add or update this column's sort
                if (existingSortIndex >= 0) {
                    // Toggle direction
                    currentSorts[existingSortIndex].direction = currentSorts[existingSortIndex].direction === 'asc' ? 'desc' : 'asc';
                } else {
                    // Add new sort
                    currentSorts.push({
                        column: columnIndex,
                        type: sortType,
                        direction: 'asc',
                        difficulty: clickedTh.dataset.difficulty,
                        oc_name: clickedTh.dataset.ocName,
                        position_id: clickedTh.dataset.positionId
                    });
                }
            } else {
                // Single sort: replace all sorts with just this one
                if (existingSortIndex >= 0 && currentSorts.length === 1) {
                    // Toggle direction if it's the only sort
                    currentSorts[0].direction = currentSorts[0].direction === 'asc' ? 'desc' : 'asc';
                } else {
                    // Replace all sorts
                    currentSorts = [{
                        column: columnIndex,
                        type: sortType,
                        direction: 'asc',
                        difficulty: clickedTh.dataset.difficulty,
                        oc_name: clickedTh.dataset.ocName,
                        position_id: clickedTh.dataset.positionId
                    }];
                }
            }

            // Sort rows based on all active sorts
            pivotRows.sort((a, b) => {
                for (let i = 0; i < currentSorts.length; i++) {
                    const sort = currentSorts[i];
                    let comparison = 0;
                    
                    if (sort.type === 'member') {
                        comparison = sort.direction === 'asc' 
                            ? a.member_name.localeCompare(b.member_name)
                            : b.member_name.localeCompare(a.member_name);
                    } else if (sort.type === 'difficulty') {
                        // Sort by all columns in this difficulty group
                        const difficulty = parseInt(sort.difficulty);
                        const relevantCells = pivotHeaderMetadata.filter(m => m.difficulty === difficulty);
                        comparison = compareByCells(a, b, relevantCells, sort.direction);
                    } else if (sort.type === 'oc_name') {
                        // Sort by all columns in this OC name group
                        const difficulty = parseInt(sort.difficulty);
                        const ocName = sort.oc_name;
                        const relevantCells = pivotHeaderMetadata.filter(m => m.difficulty === difficulty && m.oc_name === ocName);
                        comparison = compareByCells(a, b, relevantCells, sort.direction);
                    } else if (sort.type === 'position_id') {
                        // Sort by specific column
                        const colIdx = parseInt(sort.column);
                        const cellIdx = colIdx - 1; // -1 because column 0 is Member
                        comparison = compareCellValues(a.cells[cellIdx], b.cells[cellIdx], sort.direction);
                    }
                    
                    if (comparison !== 0) {
                        return comparison;
                    }
                }
                // If all sorts are equal, sort by member name
                return a.member_name.localeCompare(b.member_name);
            });

            // Update header sort indicators
            document.querySelectorAll('#pivot-header th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc', 'sort-multi');
                const colIdx = th.dataset.column;
                const sortType = th.dataset.type;
                const sortIndex = currentSorts.findIndex(s => s.column === colIdx && s.type === sortType);
                if (sortIndex >= 0) {
                    if (currentSorts.length > 1) {
                        th.classList.add('sort-multi');
                    } else {
                        th.classList.add(`sort-${currentSorts[sortIndex].direction}`);
                    }
                }
            });

            // Re-render table body
            renderPivotTableBody();
        }
        
        function compareByCells(a, b, relevantCells, direction) {
            // Compare by average or max value in relevant cells
            const aVals = relevantCells.map(m => a.cells[m.columnIndex - 1]).filter(v => v != null);
            const bVals = relevantCells.map(m => b.cells[m.columnIndex - 1]).filter(v => v != null);
            
            if (aVals.length === 0 && bVals.length === 0) return 0;
            if (aVals.length === 0) return 1;
            if (bVals.length === 0) return -1;
            
            const aAvg = aVals.reduce((sum, v) => sum + v, 0) / aVals.length;
            const bAvg = bVals.reduce((sum, v) => sum + v, 0) / bVals.length;
            
            return direction === 'asc' ? aAvg - bAvg : bAvg - aAvg;
        }
        
        function compareCellValues(aVal, bVal, direction) {
            // Handle null/undefined - treat null as less than everything
            if (aVal == null && bVal == null) return 0;
            if (aVal == null) return 1;  // null sorts to end
            if (bVal == null) return -1; // null sorts to end

            // Handle numbers
            if (typeof aVal === 'number' && typeof bVal === 'number') {
                return direction === 'asc' ? aVal - bVal : bVal - aVal;
            }

            // Fallback: compare as strings
            const comparison = aVal < bVal ? -1 : (aVal > bVal ? 1 : 0);
            return direction === 'asc' ? comparison : -comparison;
        }
        
        function renderPivotTableBody() {
            const tbody = document.getElementById('pivot-body');
            tbody.innerHTML = '';
            
            // Render rows in sorted order
            pivotRows.forEach(rowData => {
                const row = document.createElement('tr');
                row.innerHTML = `<td style="padding: 6px; border: 1px solid #ddd; border-right: 1px solid #ddd; position: sticky; left: 0; background-color: white; font-weight: bold;">${rowData.member_name}</td>`;
                
                rowData.cells.forEach((checkpointRate, idx) => {
                    if (checkpointRate !== undefined && checkpointRate !== null) {
                        // Color coding: red for < 80 or > 90, no color for 80-90 range
                        let cellClass = '';
                        if (checkpointRate < 80 || checkpointRate > 90) {
                            cellClass = 'cell-red';
                        }
                        row.innerHTML += `<td class="${cellClass}" style="padding: 6px; border: 1px solid #ddd; border-right: 1px solid #ddd; text-align: center; font-weight: bold;">${checkpointRate}</td>`;
                    } else {
                        row.innerHTML += '<td style="padding: 6px; border: 1px solid #ddd; border-right: 1px solid #ddd; text-align: center; color: #ccc;">—</td>';
                    }
                });
                
                tbody.appendChild(row);
            });
        }

        function showHistory(historyKey) {
            const records = historyData.get(historyKey);
            if (!records || records.length === 0) return;

            const historyText = records.map(r => {
                const date = r.executed_at ? new Date(r.executed_at).toLocaleDateString() : 'Unknown';
                return `${date}: ${r.checkpoint_pass_rate || 0}`;
            }).join('\n');

            alert(`History for ${records[0].oc_name} - ${records[0].position}:\n\n${historyText}`);
        }

        function displayDetailView(data) {
            const ocLevelFilter = document.getElementById('oc_level_filter').value;
            let filteredData = data;
            if (ocLevelFilter) {
                filteredData = data.filter(r => r.oc_level == ocLevelFilter);
            }

            const tbody = document.getElementById('performance-body');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="padding: 20px; text-align: center;">No performance data found</td></tr>';
                return;
            }

            // Group by member, OC name, and position for better organization
            const grouped = new Map();
            filteredData.forEach(record => {
                const key = `${record.member_name}_${record.oc_name}_${record.position}_${record.position_id}`;
                if (!grouped.has(key)) {
                    grouped.set(key, []);
                }
                grouped.get(key).push(record);
            });

            // Sort each group by executed_at (most recent first)
            grouped.forEach((records, key) => {
                records.sort((a, b) => {
                    const dateA = a.executed_at ? new Date(a.executed_at).getTime() : 0;
                    const dateB = b.executed_at ? new Date(b.executed_at).getTime() : 0;
                    return dateB - dateA;
                });
            });

            // Display records
            Array.from(grouped.values()).flat().forEach(record => {
                const row = document.createElement('tr');
                const progress = record.progress || 0;
                const executedAt = record.executed_at ? new Date(record.executed_at) : null;
                const outcome = record.outcome || '-';
                const checkpointRate = record.checkpoint_pass_rate != null ? (record.checkpoint_pass_rate * 100).toFixed(1) + '%' : '-';

                let progressClass = '';
                if (progress >= 90) progressClass = 'cell-green';
                else if (progress >= 80) progressClass = 'cell-yellow';
                else progressClass = 'cell-red';

                row.innerHTML = `
                    <td style="padding: 6px; border: 1px solid #ddd; position: sticky; left: 0; background-color: white; font-weight: bold;">${record.member_name || 'Unknown'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${record.oc_level || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.oc_name || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.position || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.position_id || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${executedAt ? executedAt.toLocaleString() : '-'}</td>
                    <td class="${progressClass}" style="padding: 6px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${progress.toFixed(1)}%</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${outcome}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${checkpointRate}</td>
                `;

                tbody.appendChild(row);
            });

            attachSortHandlers();
        }

        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }

            const ocLevelFilter = document.getElementById('oc_level_filter').value;
            const memberFilterValue = document.getElementById('member_filter').value;
            let filteredData = performanceData;
            
            if (ocLevelFilter) {
                filteredData = filteredData.filter(r => r.oc_level == ocLevelFilter);
            }
            if (memberFilterValue) {
                filteredData = filteredData.filter(r => r.member_name === memberFilterValue);
            }

            filteredData.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];

                if (aVal == null && bVal == null) return 0;
                if (aVal == null) return 1;
                if (bVal == null) return -1;

                // Handle date strings
                if (column === 'executed_at') {
                    aVal = aVal ? new Date(aVal).getTime() : 0;
                    bVal = bVal ? new Date(bVal).getTime() : 0;
                }

                if (typeof aVal === 'number' && typeof bVal === 'number') {
                    return currentSort.direction === 'asc' ? aVal - bVal : bVal - aVal;
                }

                if (typeof aVal === 'string') {
                    aVal = aVal.toLowerCase();
                    bVal = bVal.toLowerCase();
                }

                let comparison = 0;
                if (aVal < bVal) comparison = -1;
                if (aVal > bVal) comparison = 1;

                return currentSort.direction === 'asc' ? comparison : -comparison;
            });

            // Update header sort indicators
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.column === column) {
                    th.classList.add(`sort-${currentSort.direction}`);
                    th.innerHTML = th.innerHTML.replace(/ [↑↓↕]/, '') + (currentSort.direction === 'asc' ? ' ↑' : ' ↓');
                } else {
                    th.innerHTML = th.innerHTML.replace(/ [↑↓]/, '') + ' ↕';
                }
            });

            const tbody = document.getElementById('performance-body');
            tbody.innerHTML = '';

            filteredData.forEach(record => {
                const row = document.createElement('tr');
                const progress = record.progress || 0;
                const executedAt = record.executed_at ? new Date(record.executed_at) : null;
                const outcome = record.outcome || '-';
                const checkpointRate = record.checkpoint_pass_rate != null ? (record.checkpoint_pass_rate * 100).toFixed(1) + '%' : '-';

                let progressClass = '';
                if (progress >= 90) progressClass = 'cell-green';
                else if (progress >= 80) progressClass = 'cell-yellow';
                else progressClass = 'cell-red';

                row.innerHTML = `
                    <td style="padding: 6px; border: 1px solid #ddd; position: sticky; left: 0; background-color: white; font-weight: bold;">${record.member_name || 'Unknown'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${record.oc_level || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.oc_name || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.position || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.position_id || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${executedAt ? executedAt.toLocaleString() : '-'}</td>
                    <td class="${progressClass}" style="padding: 6px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${progress.toFixed(1)}%</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${outcome}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${checkpointRate}</td>
                `;

                tbody.appendChild(row);
            });

            attachSortHandlers();
        }

        function attachSortHandlers() {
            document.querySelectorAll('th.sortable').forEach(th => {
                th.addEventListener('click', (e) => {
                    e.preventDefault();
                    sortTable(th.dataset.column);
                });
            });
        }

        // Load performance data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadPerformance();
        });
    </script>
    <style>
        .cell-green {
            background-color: #c8e6c9;
        }
        .cell-yellow {
            background-color: #fff9c4;
        }
        .cell-red {
            background-color: #ffcdd2;
        }
        #performance-table {
            overflow-x: auto;
            display: block;
        }
        #performance-table thead {
            display: block;
            position: sticky;
            top: 0;
            z-index: 9;
        }
        #performance-table tbody {
            display: block;
            max-height: 600px;
            overflow-y: auto;
        }
        #performance-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        th.sortable:hover {
            background-color: #45a049;
        }
        th.sort-asc::after {
            content: ' ↑';
        }
        th.sort-desc::after {
            content: ' ↓';
        }
    </style>
</body>
