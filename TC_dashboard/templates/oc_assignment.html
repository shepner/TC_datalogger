<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Assignment Email Generator - Torn City Faction Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
        }
        textarea {
            min-height: 200px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #2196F3;
        }
        button.secondary:hover {
            background-color: #0b7dda;
        }
        .email-output {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .copy-button {
            margin-top: 10px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>OC Assignment Email Generator</h1>
            <p>Generate email text for OC assignments with member prioritization</p>
        </header>

        <div class="form-group">
            <label for="instructions">Custom Instructions (optional):</label>
            <textarea id="instructions" placeholder="Please join the OC assigned to you below. Make sure you have the required items if needed."></textarea>
        </div>

        <div class="form-group">
            <label for="max_members">Max Members per OC:</label>
            <input type="number" id="max_members" value="1" min="1" max="10">
        </div>

        <button onclick="generateEmail()">Generate Email</button>
        <a href="/"><button class="secondary">Back to Dashboard</button></a>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <div id="email-output" class="email-output" style="display: none;">
            <h3>Generated Email:</h3>
            <textarea id="email-text" readonly></textarea>
            <button class="copy-button" onclick="copyEmail()">Copy to Clipboard</button>
        </div>

        <div style="margin-top: 40px; border-top: 2px solid #ddd; padding-top: 20px;">
            <h2>OC Performance Dashboard</h2>
            <p>View member performance by role and OC level</p>
            
            <div style="margin-bottom: 15px;">
                <label for="performance_days">Days Back:</label>
                <input type="number" id="performance_days" value="90" min="7" max="365" style="width: 100px; margin-left: 10px;">
                <button onclick="loadPerformance()" style="margin-left: 10px;">Load Performance Data</button>
            </div>

            <div id="performance-container" style="display: none;">
                <div style="max-height: 70vh; overflow-y: auto; overflow-x: auto; border: 1px solid #ddd; margin-top: 20px;">
                    <table id="performance-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
                        <thead style="position: sticky; top: 0; background-color: #4CAF50; color: white; z-index: 10;">
                            <tr>
                                <th style="padding: 8px; border: 1px solid #ddd;">Member</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">OC Level</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Role</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Position</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Attempts</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Successful</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Success Rate</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Avg Progress</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Avg Checkpoint</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">Last Attempt</th>
                            </tr>
                        </thead>
                        <tbody id="performance-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateEmail() {
            const instructions = document.getElementById('instructions').value;
            const maxMembers = parseInt(document.getElementById('max_members').value);
            
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('email-output').style.display = 'none';

            try {
                const response = await fetch('/api/oc-assignment/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        instructions: instructions || null,
                        max_members_per_oc: maxMembers
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate email');
                }

                document.getElementById('email-text').value = data.email_text;
                document.getElementById('email-output').style.display = 'block';
                document.getElementById('success').textContent = 'Email generated successfully!';
                document.getElementById('success').style.display = 'block';
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function copyEmail() {
            const emailText = document.getElementById('email-text');
            emailText.select();
            emailText.setSelectionRange(0, 99999); // For mobile devices
            document.execCommand('copy');
            
            const button = event.target;
            const originalText = button.textContent;
            button.textContent = 'Copied!';
            setTimeout(() => {
                button.textContent = originalText;
            }, 2000);
        }

        async function loadPerformance() {
            const daysBack = document.getElementById('performance_days').value;
            document.getElementById('error').style.display = 'none';

            try {
                const response = await fetch(`/api/oc-assignment/performance?days_back=${daysBack}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load performance data');
                }

                displayPerformance(data.performance);
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function displayPerformance(performance) {
            const tbody = document.getElementById('performance-body');
            tbody.innerHTML = '';

            if (performance.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10">No performance data found</td></tr>';
                document.getElementById('performance-container').style.display = 'block';
                return;
            }

            performance.forEach(record => {
                const row = document.createElement('tr');
                const successRate = record.success_rate || 0;
                const avgProgress = record.avg_progress || 0;
                const lastAttempt = record.last_attempt_date ? new Date(record.last_attempt_date) : null;

                // Color coding for success rate
                let successRateClass = '';
                if (successRate >= 90) successRateClass = 'cell-green';
                else if (successRate >= 80) successRateClass = 'cell-yellow';
                else successRateClass = 'cell-red';

                // Color coding for avg progress
                let progressClass = '';
                if (avgProgress >= 90) progressClass = 'cell-green';
                else if (avgProgress >= 80) progressClass = 'cell-yellow';
                else progressClass = 'cell-red';

                row.innerHTML = `
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.member_name || 'Unknown'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${record.oc_level || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.role || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${record.position_id || '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${record.total_attempts || 0}</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${record.successful_attempts || 0}</td>
                    <td class="${successRateClass}" style="padding: 6px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${successRate.toFixed(1)}%</td>
                    <td class="${progressClass}" style="padding: 6px; border: 1px solid #ddd; text-align: center;">${avgProgress.toFixed(1)}%</td>
                    <td style="padding: 6px; border: 1px solid #ddd; text-align: center;">${record.avg_checkpoint_pass_rate ? record.avg_checkpoint_pass_rate.toFixed(1) + '%' : '-'}</td>
                    <td style="padding: 6px; border: 1px solid #ddd;">${lastAttempt ? lastAttempt.toLocaleDateString() : '-'}</td>
                `;

                tbody.appendChild(row);
            });

            document.getElementById('performance-container').style.display = 'block';
        }

        // Load performance data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadPerformance();
        });
    </script>
    <style>
        .cell-green {
            background-color: #c8e6c9;
        }
        .cell-yellow {
            background-color: #fff9c4;
        }
        .cell-red {
            background-color: #ffcdd2;
        }
        #performance-table tbody tr:hover {
            background-color: #f5f5f5;
        }
    </style>
</body>
</html>
