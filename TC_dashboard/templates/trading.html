<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard - Torn City Faction Management</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }
        .toolbar {
            margin-bottom: 8px;
            padding: 6px 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border: 1px solid #ddd;
        }
        .toolbar label {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .toolbar input, .toolbar select {
            padding: 4px 6px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
        }
        .toolbar input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        button {
            padding: 6px 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
            font-size: 13px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.secondary {
            background-color: #2196F3;
        }
        button.small {
            padding: 3px 6px;
            font-size: 11px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }
        th, td {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .actions {
            white-space: nowrap;
        }
        .error {
            color: red;
            margin-top: 8px;
            font-size: 13px;
        }
        .success {
            color: green;
            margin-top: 8px;
            font-size: 13px;
        }
        .paid {
            background-color: #e8f5e9;
        }
        .paid:hover {
            background-color: #c8e6c9;
        }
        .member-details table {
            font-size: 11px;
        }
        .member-details th, .member-details td {
            padding: 4px 6px;
        }
        .member-details th {
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
            <h1 style="margin: 0; font-size: 18px; font-weight: 600; color: #333;">Trading Dashboard</h1>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="pull-data-btn" onclick="triggerDataPull()" style="padding: 6px 12px; font-size: 12px; background-color: #2196F3; color: white; border: none; border-radius: 3px; cursor: pointer;">Pull Data from TC API</button>
                <a href="/" style="text-decoration: none; font-size: 12px; color: #666; padding: 4px 8px; border: 1px solid #ccc; border-radius: 3px; background-color: #f5f5f5;">← Back to Dashboard</a>
            </div>
        </div>
        <div id="data-pull-status" style="display: none; margin-bottom: 10px; padding: 8px; border-radius: 4px; font-size: 12px;"></div>

        <div class="toolbar">
            <label>Days Back:</label>
            <input type="number" id="days_back" value="30" min="1" max="365" style="width: 60px;">
            
            <label>View:</label>
            <select id="view_mode">
                <option value="grouped" selected>Grouped by Member</option>
                <option value="individual">Individual Trades</option>
            </select>
            
            <label>Member Filter:</label>
            <select id="member_filter" style="width: 180px;">
                <option value="">All Members</option>
            </select>
            
            <label style="display: flex; align-items: center; gap: 4px;">
                <input type="checkbox" id="show_paid" onchange="loadTrades()">
                <span>Show Paid</span>
            </label>
            
            <button onclick="loadTrades()">Load Trades</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <!-- Modal for raw events -->
        <div id="rawEventsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="rawEventsModalTitle">Raw Event Logs</h2>
                    <button class="close" onclick="closeRawEventsModal()">&times;</button>
                </div>
                <div id="rawEventsContent">
                    <p>Loading events...</p>
                </div>
            </div>
        </div>

        <div id="trades-container">
            <!-- Grouped view table -->
            <table id="grouped-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Trade Count</th>
                        <th>Total Quantity</th>
                        <th>Total Payment</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="grouped-body">
                </tbody>
            </table>
            
            <!-- Individual view table -->
            <table id="trades-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Member</th>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Market Price</th>
                        <th>Sales Fee</th>
                        <th>Buy Price</th>
                        <th>Market Value</th>
                        <th>Payment Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="trades-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentTrades = [];
        let isGrouped = true;

        let showPaid = false;

        async function loadTrades() {
            const daysBack = document.getElementById('days_back').value;
            const memberFilter = document.getElementById('member_filter').value;
            const viewMode = document.getElementById('view_mode').value;
            showPaid = document.getElementById('show_paid').checked;
            isGrouped = viewMode === 'grouped';

            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';

            try {
                let url = `/api/trading/pending?days_back=${daysBack}&grouped=${isGrouped}&show_paid=${showPaid}`;
                if (memberFilter && !isGrouped) {
                    url += `&member=${encodeURIComponent(memberFilter)}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load trades');
                }

                currentTrades = data.trades;
                if (isGrouped) {
                    displayGroupedTrades(currentTrades, showPaid);
                } else {
                    displayTrades(currentTrades, showPaid);
                }
            } catch (error) {
                document.getElementById('error').textContent = error.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function displayTrades(trades, isPaid = false) {
            const tbody = document.getElementById('trades-body');
            tbody.innerHTML = '';

            if (trades.length === 0) {
                const message = isPaid ? 'No paid trades found' : 'No pending trades found';
                tbody.innerHTML = `<tr><td colspan="10">${message}</td></tr>`;
                document.getElementById('trades-table').style.display = 'table';
                return;
            }

            trades.forEach(trade => {
                const row = document.createElement('tr');
                row.dataset.eventId = trade.event_id;
                if (isPaid) {
                    row.classList.add('paid');
                }

                const date = new Date(trade.timestamp);
                const totalValue = trade.total_value || 0;
                const marketPrice = trade.market_price || 0;
                const salesFee = (trade.sales_fee || 0) * 100; // Convert to percentage
                const buyPrice = trade.buy_price || 0;
                const paymentAmount = trade.payment_amount || 0;

                const actionButtons = isPaid 
                    ? `<button class="small" onclick="undoPaidStatus('${trade.event_id}')">Undo Paid Status</button>`
                    : `<button class="small" onclick="copyValue('${paymentAmount}')">Copy Payment</button>
                       <button class="small copy-chat-btn" data-trade="${JSON.stringify(trade).replace(/"/g, '&quot;')}" title="${formatChatMessage(trade).replace(/"/g, '&quot;')}">Copy Chat</button>
                       <button class="small" data-event-id="${trade.event_id}" data-trade='${JSON.stringify(trade).replace(/'/g, "&#39;")}' onclick="markAsPaidFromButton(this)">Mark Paid</button>
                       <button class="small" onclick="showRawEvents('${userName.replace(/'/g, "&#39;")}')" title="Show raw event logs for ${userName}">Raw Events</button>`;

                const userName = trade.user_name || 'Unknown';
                const userId = trade.user_id || trade.user_id;
                const memberNameCell = userId 
                    ? `<a href="https://www.torn.com/profiles.php?XID=${userId}" target="_blank" style="color: #4CAF50; text-decoration: none; font-weight: 500;">${userName}</a>`
                    : userName;
                
                row.innerHTML = `
                    <td>${date.toLocaleString()}</td>
                    <td>${memberNameCell}</td>
                    <td>${trade.item_name || 'Unknown Item'}</td>
                    <td>${trade.quantity || 0}</td>
                    <td>$${marketPrice.toLocaleString()}</td>
                    <td>${salesFee.toFixed(1)}%</td>
                    <td>$${buyPrice.toLocaleString()}</td>
                    <td>$${totalValue.toLocaleString()}</td>
                    <td>$${paymentAmount.toLocaleString()}</td>
                    <td class="actions">
                        ${actionButtons}
                    </td>
                `;

                tbody.appendChild(row);
                
                // Attach event listener to copy chat button
                const copyChatBtn = row.querySelector('.copy-chat-btn');
                if (copyChatBtn) {
                    copyChatBtn.addEventListener('click', function() {
                        try {
                            const tradeData = JSON.parse(this.dataset.trade);
                            copyChatMessage(tradeData);
                        } catch (error) {
                            console.error('Error parsing trade data:', error);
                            showError('Failed to parse trade data');
                        }
                    });
                }
            });

            document.getElementById('trades-table').style.display = 'table';
            document.getElementById('grouped-table').style.display = 'none';
        }

        function displayGroupedTrades(memberGroups, isPaid = false) {
            const tbody = document.getElementById('grouped-body');
            tbody.innerHTML = '';

            if (memberGroups.length === 0) {
                const message = isPaid ? 'No paid trades found' : 'No pending trades found';
                tbody.innerHTML = `<tr><td colspan="5">${message}</td></tr>`;
                document.getElementById('grouped-table').style.display = 'table';
                document.getElementById('trades-table').style.display = 'none';
                return;
            }

            memberGroups.forEach(member => {
                const row = document.createElement('tr');
                if (isPaid) {
                    row.classList.add('paid');
                }
                const totalPayment = member.total_payment_amount || 0;
                const tradeCount = member.trade_count || 0;
                const totalQuantity = member.total_quantity || 0;
                
                // Handle trades - could be array or nested structure from BigQuery
                let trades = member.trades || [];
                if (!Array.isArray(trades)) {
                    trades = [];
                }
                
                // Flatten trades if they're nested structures
                trades = trades.map(t => {
                    if (typeof t === 'object' && t !== null) {
                        // Handle BigQuery STRUCT format
                        return {
                            event_id: t.event_id || t.get && t.get('event_id'),
                            timestamp: t.timestamp || t.get && t.get('timestamp'),
                            user_name: t.user_name || t.get && t.get('user_name') || member.member_name,
                            user_id: t.user_id || t.get && t.get('user_id'),
                            item_name: t.item_name || t.get && t.get('item_name'),
                            quantity: t.quantity || t.get && t.get('quantity'),
                            market_price: t.market_price || t.get && t.get('market_price'),
                            sales_fee: t.sales_fee || t.get && t.get('sales_fee'),
                            buy_price: t.buy_price || t.get && t.get('buy_price'),
                            payment_amount: t.payment_amount || t.get && t.get('payment_amount')
                        };
                    }
                    return t;
                });
                
                const memberId = member.member_name.replace(/\s+/g, '-');
                const tradesHtml = trades.map((trade, index) => {
                    const date = new Date(trade.timestamp);
                    const individualPayment = trade.payment_amount || 0;
                    const marketPrice = trade.market_price || 0;
                    const salesFee = ((trade.sales_fee || 0) * 100).toFixed(1);
                    const buyPrice = trade.buy_price || 0;
                    const tradeJson = JSON.stringify(trade).replace(/'/g, "\\'");
                    const checkboxId = `trade-checkbox-${memberId}-${index}`;
                    return `
                        <tr class="trade-detail">
                            <td><input type="checkbox" class="trade-checkbox" id="${checkboxId}" data-trade-index="${index}" checked></td>
                            <td>${date.toLocaleString()}</td>
                            <td>${trade.item_name || 'Unknown'}</td>
                            <td>${trade.quantity || 0}</td>
                            <td>$${marketPrice.toLocaleString()}</td>
                            <td>${salesFee}%</td>
                            <td>$${buyPrice.toLocaleString()}</td>
                            <td>$${individualPayment.toLocaleString()}</td>
                            <td class="actions">
                                ${isPaid 
                                    ? `<button class="small" onclick="undoPaidStatus('${trade.event_id}')">Undo Paid Status</button>`
                                    : `<button class="small copy-chat-btn" data-trade="${JSON.stringify(trade).replace(/"/g, '&quot;')}" title="${formatChatMessage(trade).replace(/"/g, '&quot;')}">Copy Chat</button>
                                       <button class="small" data-event-id="${trade.event_id}" data-trade='${JSON.stringify(trade).replace(/'/g, "&#39;")}' onclick="markAsPaidFromButton(this)">Mark Paid</button>`
                                }
                            </td>
                        </tr>
                    `;
                }).join('');

                // Escape member name for HTML attributes
                const memberNameEscaped = (member.member_name || 'Unknown').replace(/"/g, '&quot;');
                // Store trades in data attribute - escape quotes for HTML attribute
                const tradesJson = JSON.stringify(trades).replace(/"/g, '&quot;');
                
                const memberName = member.member_name || 'Unknown';
                const memberId = member.member_id || member.member_id;
                const memberNameLink = memberId 
                    ? `<a href="https://www.torn.com/profiles.php?XID=${memberId}" target="_blank" style="color: #4CAF50; text-decoration: none; font-weight: 500;">${memberName}</a>`
                    : memberName;
                
                row.innerHTML = `
                    <td>
                        <button class="small" onclick="toggleMemberTrades(this)" style="margin-right: 5px;">▶</button>
                        ${memberNameLink}
                    </td>
                    <td class="trade-count-${memberId}">${tradeCount}</td>
                    <td class="total-quantity-${memberId}">${totalQuantity}</td>
                    <td class="total-payment-${memberId}">$${totalPayment.toLocaleString()}</td>
                    <td class="actions">
                        ${isPaid 
                            ? `<button class="small undo-all-paid-btn" data-member-name="${memberNameEscaped}" data-trades="${tradesJson}">Undo All Paid</button>`
                            : `<button class="small copy-total-btn" data-member-id="${memberId}" title="${totalPayment.toLocaleString()}">Copy Total</button>
                               <button class="small copy-all-chat-btn" 
                                       data-member-id="${memberId}"
                                       data-trades="${tradesJson}">Copy Chat</button>
                               <button class="small" onclick="showRawEvents('${memberName.replace(/'/g, "&#39;")}')" title="Show raw event logs for ${memberName}">Raw Events</button>
                               <button class="small mark-all-paid-btn" 
                                       data-member-name="${memberNameEscaped}" 
                                       data-trades="${tradesJson}">Mark All Paid</button>`
                        }
                    </td>
                `;

                tbody.appendChild(row);
                
                // Attach event listener to the button
                const markAllBtn = row.querySelector('.mark-all-paid-btn');
                if (markAllBtn) {
                    markAllBtn.addEventListener('click', function() {
                        const memberName = this.dataset.memberName;
                        try {
                            const tradesData = JSON.parse(this.dataset.trades);
                            markAllAsPaid(memberName, tradesData);
                        } catch (error) {
                            console.error('Error parsing trades data:', error);
                            showError('Failed to parse trades data');
                        }
                    });
                }
                
                // Add detail rows
                const detailRow = document.createElement('tr');
                detailRow.innerHTML = `
                    <td colspan="5">
                        <table style="width: 100%; margin-left: 10px; font-size: 11px;">
                            <thead>
                                <tr style="background-color: #e8f5e9;">
                                    <th><input type="checkbox" class="select-all-checkbox" id="select-all-${memberId}" checked></th>
                                    <th>Date</th>
                                    <th>Item</th>
                                    <th>Quantity</th>
                                    <th>Market Price</th>
                                    <th>Sales Fee</th>
                                    <th>Buy Price</th>
                                    <th>Payment</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody class="member-trades-${memberId}" data-member-id="${memberId}">
                                ${tradesHtml}
                            </tbody>
                        </table>
                    </td>
                `;
                detailRow.style.display = 'none';
                detailRow.className = 'member-details';
                tbody.appendChild(detailRow);
                
                // Attach event listeners to copy chat buttons in the detail row (only if not paid)
                if (!isPaid) {
                    const copyChatBtns = detailRow.querySelectorAll('.copy-chat-btn');
                    copyChatBtns.forEach(btn => {
                        btn.addEventListener('click', function() {
                            try {
                                const tradeData = JSON.parse(this.dataset.trade);
                                copyChatMessage(tradeData);
                            } catch (error) {
                                console.error('Error parsing trade data:', error);
                                showError('Failed to parse trade data');
                            }
                        });
                    });
                }
                
                // Attach event listener to undo all paid button (if showing paid items)
                const undoAllPaidBtn = row.querySelector('.undo-all-paid-btn');
                if (undoAllPaidBtn) {
                    undoAllPaidBtn.addEventListener('click', function() {
                        const memberName = this.dataset.memberName;
                        try {
                            const tradesData = JSON.parse(this.dataset.trades);
                            undoAllPaidStatus(memberName, tradesData);
                        } catch (error) {
                            console.error('Error parsing trades data:', error);
                            showError('Failed to parse trades data');
                        }
                    });
                }
                
                // Attach event listener to copy total button
                const copyTotalBtn = row.querySelector('.copy-total-btn');
                if (copyTotalBtn) {
                    copyTotalBtn.addEventListener('click', function() {
                        const memberId = this.dataset.memberId;
                        const totalElement = document.querySelector(`.total-payment-${memberId}`);
                        if (totalElement) {
                            const totalText = totalElement.textContent.replace(/[$,]/g, '');
                            copyValue(totalText);
                        }
                    });
                }
                
                // Attach event listener to copy all chat button
                const copyAllChatBtn = row.querySelector('.copy-all-chat-btn');
                if (copyAllChatBtn) {
                    // Function to update tooltip for copy all chat button
                    const updateCopyAllTooltip = () => {
                        const checkboxes = document.querySelectorAll(`.member-trades-${memberId} .trade-checkbox`);
                        const checkedTrades = [];
                        checkboxes.forEach((checkbox, index) => {
                            if (checkbox.checked && trades[index]) {
                                checkedTrades.push(trades[index]);
                            }
                        });
                        if (checkedTrades.length === 0) {
                            copyAllChatBtn.title = 'No trades selected';
                        } else {
                            const messages = checkedTrades.map(t => formatChatMessage(t));
                            const totalPayment = checkedTrades.reduce((sum, t) => sum + (t.payment_amount || 0), 0);
                            messages.push(`$${totalPayment.toLocaleString()} deposited to the vault!`);
                            copyAllChatBtn.title = messages.join('\\n');
                        }
                    };
                    
                    // Set initial tooltip
                    updateCopyAllTooltip();
                    
                    // Update tooltip when checkboxes change
                    const checkboxes = detailRow.querySelectorAll('.trade-checkbox');
                    checkboxes.forEach(checkbox => {
                        checkbox.addEventListener('change', updateCopyAllTooltip);
                    });
                    
                    copyAllChatBtn.addEventListener('click', function() {
                        const memberId = this.dataset.memberId;
                        try {
                            const tradesData = JSON.parse(this.dataset.trades);
                            copyAllChatMessages(memberId, tradesData);
                        } catch (error) {
                            console.error('Error parsing trades data:', error);
                            showError('Failed to parse trades data');
                        }
                    });
                }
                
                // Attach event listener to select all checkbox
                const selectAllCheckbox = detailRow.querySelector('.select-all-checkbox');
                if (selectAllCheckbox) {
                    selectAllCheckbox.addEventListener('change', function() {
                        const memberId = this.id.replace('select-all-', '');
                        const checkboxes = detailRow.querySelectorAll(`.member-trades-${memberId} .trade-checkbox`);
                        checkboxes.forEach(cb => cb.checked = this.checked);
                        updateMemberTotals(memberId, trades);
                    });
                }
                
                // Attach event listeners to individual checkboxes
                const tradeCheckboxes = detailRow.querySelectorAll('.trade-checkbox');
                tradeCheckboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const memberId = this.closest('tbody').dataset.memberId;
                        updateSelectAllState(memberId);
                        updateMemberTotals(memberId, trades);
                    });
                });
                
                // Initialize select-all state and totals (all checked by default)
                updateSelectAllState(memberId);
                // Totals are already correct from backend, but we can verify if needed
            });

            document.getElementById('grouped-table').style.display = 'table';
            document.getElementById('trades-table').style.display = 'none';
        }

        function toggleMemberTrades(button) {
            const row = button.closest('tr');
            const nextRow = row.nextElementSibling;
            if (nextRow && nextRow.classList.contains('member-details')) {
                const isVisible = nextRow.style.display !== 'none';
                nextRow.style.display = isVisible ? 'none' : '';
                button.textContent = isVisible ? '▶' : '▼';
            }
        }

        async function markAllAsPaid(memberName, trades) {
            if (!trades || !Array.isArray(trades) || trades.length === 0) {
                showError('No trades to mark as paid');
                return;
            }
            
            if (!confirm(`Mark all ${trades.length} trades for ${memberName} as paid?`)) {
                return;
            }
            
            try {
                let successCount = 0;
                let errorCount = 0;
                
                for (const trade of trades) {
                    if (!trade || !trade.event_id) {
                        console.error('Invalid trade:', trade);
                        errorCount++;
                        continue;
                    }
                    
                    // Ensure trade has user_name/member_name for database saving
                    const tradeWithMember = {
                        ...trade,
                        user_name: trade.user_name || memberName,
                        member_name: trade.member_name || memberName
                    };
                    
                    try {
                        const response = await fetch('/api/trading/mark-paid', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                event_id: trade.event_id,
                                trade: tradeWithMember
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (!response.ok) {
                            throw new Error(data.error || `Failed to mark trade ${trade.event_id} as paid`);
                        }
                        
                        successCount++;
                    } catch (error) {
                        console.error(`Error marking trade ${trade.event_id} as paid:`, error);
                        errorCount++;
                    }
                }
                
                if (errorCount > 0) {
                    showError(`Marked ${successCount} trades as paid, but ${errorCount} failed`);
                } else {
                    // Validate that all trades were actually saved to the database
                    const eventIds = trades.map(t => t.event_id).filter(id => id);
                    try {
                        const validateResponse = await fetch('/api/trading/validate-paid', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ event_ids: eventIds })
                        });
                        
                        const validateData = await validateResponse.json();
                        
                        if (validateData.valid && validateData.found_count === eventIds.length) {
                            showSuccess(`Marked all ${successCount} trades for ${memberName} as paid and validated in database`);
                        } else {
                            const missingCount = validateData.missing_count || 0;
                            showError(`Marked ${successCount} trades as paid, but ${missingCount} were not found in database. Please check.`);
                        }
                    } catch (validateError) {
                        console.error('Error validating paid trades:', validateError);
                        showSuccess(`Marked all ${successCount} trades for ${memberName} as paid (validation skipped)`);
                    }
                }
                
                // Reload trades to update the view
                loadTrades();
            } catch (error) {
                console.error('Error in markAllAsPaid:', error);
                showError(error.message || 'Failed to mark trades as paid');
            }
        }

        function copyValue(value) {
            navigator.clipboard.writeText(value).then(() => {
                showSuccess('Value copied to clipboard!');
            });
        }

        function formatChatMessage(trade) {
            const quantity = trade.quantity || 0;
            const item_name = trade.item_name || 'Unknown Item';
            const payment_amount = trade.payment_amount || 0;
            const individual_payment = quantity > 0 ? Math.floor(payment_amount / quantity) : 0;
            return `${quantity} ${item_name} * $${individual_payment} = $${payment_amount} deposited to the vault!`;
        }

        function updateMemberTotals(memberId, trades) {
            const checkboxes = document.querySelectorAll(`.member-trades-${memberId} .trade-checkbox`);
            let checkedCount = 0;
            let totalQuantity = 0;
            let totalPayment = 0;
            
            checkboxes.forEach((checkbox, index) => {
                if (checkbox.checked && trades[index]) {
                    checkedCount++;
                    totalQuantity += trades[index].quantity || 0;
                    totalPayment += trades[index].payment_amount || 0;
                }
            });
            
            // Update the totals in the member row
            const memberRow = document.querySelector(`.trade-count-${memberId}`).closest('tr');
            if (memberRow) {
                memberRow.querySelector(`.trade-count-${memberId}`).textContent = checkedCount;
                memberRow.querySelector(`.total-quantity-${memberId}`).textContent = totalQuantity;
                memberRow.querySelector(`.total-payment-${memberId}`).textContent = `$${totalPayment.toLocaleString()}`;
            }
        }

        function updateSelectAllState(memberId) {
            const checkboxes = document.querySelectorAll(`.member-trades-${memberId} .trade-checkbox`);
            const selectAllCheckbox = document.getElementById(`select-all-${memberId}`);
            
            if (!selectAllCheckbox || checkboxes.length === 0) return;
            
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            
            if (checkedCount === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            } else if (checkedCount === checkboxes.length) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            }
        }

        async function copyAllChatMessages(memberId, trades) {
            const checkboxes = document.querySelectorAll(`.member-trades-${memberId} .trade-checkbox`);
            const checkedTrades = [];
            
            checkboxes.forEach((checkbox, index) => {
                if (checkbox.checked && trades[index]) {
                    checkedTrades.push(trades[index]);
                }
            });
            
            if (checkedTrades.length === 0) {
                showError('No trades selected');
                return;
            }
            
            try {
                const messages = [];
                let totalPayment = 0;
                
                for (const trade of checkedTrades) {
                    const response = await fetch('/api/trading/chat-message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ trade: trade })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to format message');
                    }
                    
                    messages.push(data.message);
                    totalPayment += trade.payment_amount || 0;
                }
                
                // Add final line with total payment
                messages.push(`$${totalPayment.toLocaleString()} deposited to the vault!`);
                
                const allMessages = messages.join('\n');
                navigator.clipboard.writeText(allMessages).then(() => {
                    showSuccess(`Copied ${checkedTrades.length} chat message(s) to clipboard!`);
                });
            } catch (error) {
                console.error('Error copying chat messages:', error);
                showError(error.message || 'Failed to copy chat messages');
            }
        }

        async function copyChatMessage(trade) {
            try {
                const response = await fetch('/api/trading/chat-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ trade: trade })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to format message');
                }

                navigator.clipboard.writeText(data.message).then(() => {
                    showSuccess('Chat message copied to clipboard!');
                });
            } catch (error) {
                showError(error.message);
            }
        }

        async function unmarkAsPaid(eventId) {
            if (!confirm('Unmark this trade as paid?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/trading/unmark-paid', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ event_id: eventId })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to unmark trade as paid');
                }

                showSuccess('Trade unmarked as paid');
                loadTrades();
            } catch (error) {
                showError(error.message);
            }
        }

        async function undoPaidStatus(eventId) {
            await unmarkAsPaid(eventId);
        }

        async function showRawEvents(userName) {
            const modal = document.getElementById('rawEventsModal');
            const modalTitle = document.getElementById('rawEventsModalTitle');
            const modalContent = document.getElementById('rawEventsContent');
            const daysBack = document.getElementById('days_back').value;
            
            modalTitle.textContent = `Raw Event Logs for ${userName}`;
            modalContent.innerHTML = '<p>Loading events...</p>';
            modal.style.display = 'block';
            
            try {
                const response = await fetch(`/api/trading/raw-events?user_name=${encodeURIComponent(userName)}&days_back=${daysBack}`);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load raw events');
                }
                
                const events = data.events || [];
                
                if (events.length === 0) {
                    modalContent.innerHTML = `<p>No raw events found for ${userName} in the last ${daysBack} days.</p>`;
                    return;
                }
                
                let tableHtml = `
                    <table class="raw-events-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Event ID</th>
                                <th>Event Text</th>
                                <th>Fetched At</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                events.forEach(event => {
                    const timestamp = event.timestamp ? new Date(event.timestamp).toLocaleString() : 'N/A';
                    const fetchedAt = event.fetched_at ? new Date(event.fetched_at).toLocaleString() : 'N/A';
                    const eventText = (event.event || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    
                    tableHtml += `
                        <tr>
                            <td>${timestamp}</td>
                            <td>${event.event_id || 'N/A'}</td>
                            <td class="event-text">${eventText}</td>
                            <td>${fetchedAt}</td>
                        </tr>
                    `;
                });
                
                tableHtml += `
                        </tbody>
                    </table>
                    <p style="margin-top: 10px; font-size: 11px; color: #666;">Showing ${events.length} event(s)</p>
                `;
                
                modalContent.innerHTML = tableHtml;
            } catch (error) {
                console.error('Error loading raw events:', error);
                modalContent.innerHTML = `<p style="color: red;">Error loading raw events: ${error.message}</p>`;
            }
        }
        
        function closeRawEventsModal() {
            const modal = document.getElementById('rawEventsModal');
            modal.style.display = 'none';
        }
        
        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('rawEventsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        async function triggerDataPull() {
            const btn = document.getElementById('pull-data-btn');
            const statusDiv = document.getElementById('data-pull-status');
            
            // Disable button and show status
            btn.disabled = true;
            btn.textContent = 'Pulling Data...';
            statusDiv.style.display = 'block';
            statusDiv.style.backgroundColor = '#fff3cd';
            statusDiv.style.color = '#856404';
            statusDiv.style.border = '1px solid #ffc107';
            
            // Only update services/tables used by the trading dashboard
            // - v2_torn_user_events-raw (from user_events)
            // - v2_torn_items-raw (from items)
            // - v2_faction_40832_members-raw (from faction_members) - for user IDs
            const services = ['user_events', 'items', 'faction_members'];
            let startTime = Date.now();
            
            // Show initial status with service list
            const updateStatus = (message, showServices = false) => {
                let statusMsg = message;
                if (showServices) {
                    statusMsg += '\n\nPulling data for:\n';
                    services.forEach(s => {
                        statusMsg += `  • ${s}\n`;
                    });
                }
                statusDiv.innerHTML = statusMsg.replace(/\n/g, '<br>');
            };
            
            updateStatus('🔄 Starting data pull...', true);
            
            // Update elapsed time every second
            const timeInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const currentStatus = statusDiv.textContent || statusDiv.innerText;
                if (!currentStatus.includes('completed') && !currentStatus.includes('Error')) {
                    updateStatus(`🔄 Pulling data... (${minutes}m ${seconds}s elapsed)`, true);
                }
            }, 1000);
            
            try {
                const response = await fetch('/api/data-pull/trigger', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ services: services })
                });
                
                clearInterval(timeInterval);
                const data = await response.json();
                const totalTime = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(totalTime / 60);
                const seconds = totalTime % 60;
                
                if (data.success) {
                    statusDiv.style.backgroundColor = '#d4edda';
                    statusDiv.style.color = '#155724';
                    statusDiv.style.border = '1px solid #c3e6cb';
                    
                    // Show success with service details
                    const successCount = Object.values(data.results || {}).filter(r => r.success).length;
                    let successMsg = `✅ Data pull completed successfully!\n\n`;
                    successMsg += `Completed in ${minutes}m ${seconds}s\n`;
                    successMsg += `${successCount} of ${services.length} services completed successfully.\n\n`;
                    successMsg += `Reloading page in 3 seconds...`;
                    statusDiv.innerHTML = successMsg.replace(/\n/g, '<br>');
                    
                    // Wait a moment, then reload the page
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                } else {
                    statusDiv.style.backgroundColor = '#f8d7da';
                    statusDiv.style.color = '#721c24';
                    statusDiv.style.border = '1px solid #f5c6cb';
                    
                    let errorMsg = `❌ Data pull completed with errors\n\n`;
                    errorMsg += `Completed in ${minutes}m ${seconds}s\n\n`;
                    
                    if (data.results) {
                        Object.entries(data.results).forEach(([service, result]) => {
                            if (result.success) {
                                errorMsg += `✅ ${service}: Success\n`;
                            } else {
                                errorMsg += `❌ ${service}: ${result.error || 'Failed'}\n`;
                            }
                        });
                    }
                    
                    if (data.skipped && data.skipped.length > 0) {
                        errorMsg += `\n⚠️ Skipped services:\n`;
                        data.skipped.forEach(s => {
                            errorMsg += `  • ${s.name}: ${s.reason}\n`;
                        });
                    }
                    
                    statusDiv.innerHTML = errorMsg.replace(/\n/g, '<br>');
                    btn.disabled = false;
                    btn.textContent = 'Pull Data from TC API';
                }
            } catch (error) {
                clearInterval(timeInterval);
                statusDiv.style.backgroundColor = '#f8d7da';
                statusDiv.style.color = '#721c24';
                statusDiv.style.border = '1px solid #f5c6cb';
                statusDiv.innerHTML = `❌ Error: ${error.message}`;
                btn.disabled = false;
                btn.textContent = 'Pull Data from TC API';
            }
        }

        async function undoAllPaidStatus(memberName, trades) {
            if (!trades || !Array.isArray(trades) || trades.length === 0) {
                showError('No trades to undo for ' + memberName);
                return;
            }
            
            if (!confirm(`Undo paid status for all ${trades.length} trades for ${memberName}?`)) {
                return;
            }
            
            try {
                let successCount = 0;
                let errorCount = 0;
                
                for (const trade of trades) {
                    if (!trade || !trade.event_id) {
                        console.error('Invalid trade:', trade);
                        errorCount++;
                        continue;
                    }
                    
                    try {
                        const response = await fetch('/api/trading/unmark-paid', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ event_id: trade.event_id })
                        });
                        
                        const data = await response.json();
                        
                        if (!response.ok) {
                            throw new Error(data.error || `Failed to undo paid status for trade ${trade.event_id}`);
                        }
                        
                        successCount++;
                    } catch (error) {
                        console.error(`Error undoing paid status for trade ${trade.event_id}:`, error);
                        errorCount++;
                    }
                }
                
                if (errorCount > 0) {
                    showError(`Undid paid status for ${successCount} trades, but ${errorCount} failed`);
                } else {
                    showSuccess(`Undid paid status for all ${successCount} trades for ${memberName}`);
                }
                
                if (successCount > 0) {
                    loadTrades();
                }
            } catch (error) {
                console.error('Error in undoAllPaidStatus:', error);
                showError(error.message || 'Failed to undo paid status');
            }
        }

        async function markAsPaidFromButton(button) {
            const eventId = button.dataset.eventId;
            const trade = JSON.parse(button.dataset.trade);
            await markAsPaid(eventId, trade);
        }

        async function markAsPaid(eventId, trade) {
            try {
                const response = await fetch('/api/trading/mark-paid', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        event_id: eventId,
                        trade: trade
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to mark as paid');
                }

                // Remove from display
                const row = document.querySelector(`tr[data-event-id="${eventId}"]`);
                if (row) {
                    row.classList.add('paid');
                    row.querySelector('.actions').innerHTML = '<span style="color: green;">Paid</span>';
                }

                showSuccess('Trade marked as paid!');
            } catch (error) {
                showError(error.message);
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // Load trades on page load
        async function loadMemberNames() {
            try {
                const response = await fetch('/api/trading/member-names?days_back=365');
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load member names');
                }
                
                const memberFilter = document.getElementById('member_filter');
                const memberNames = data.member_names || [];
                
                // Clear existing options except "All Members"
                memberFilter.innerHTML = '<option value="">All Members</option>';
                
                // Add member names to dropdown
                memberNames.forEach(memberName => {
                    const option = document.createElement('option');
                    option.value = memberName;
                    option.textContent = memberName;
                    memberFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading member names:', error);
                // Don't show error to user, just log it - dropdown will just have "All Members"
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadMemberNames();
            loadTrades();
        });
    </script>
