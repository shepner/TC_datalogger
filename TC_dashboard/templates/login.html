<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Torn City Faction Management</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        .login-box {
            max-width: 360px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .login-box h1 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .login-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }
        .login-box input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .login-box input:focus {
            outline: none;
            border-color: #3498db;
        }
        .login-box .btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
        }
        .login-error {
            color: #c0392b;
            font-size: 14px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        {% if setup_mode %}
        <h1>Create First Account</h1>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">No accounts exist yet. Create the first administrator account to get started.</p>
        {% else %}
        <h1>Sign in</h1>
        {% endif %}
        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('login', next=next) }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="{{ 'new-password' if setup_mode else 'current-password' }}" required>
            {% if setup_mode %}
            <label for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" required>
            {% endif %}
            <button type="submit" class="btn btn-primary">{{ 'Create Account' if setup_mode else 'Sign in' }}</button>
        </form>
    </div>
</body>
</html>
