services:
  tc-faction-crimes:
    build:
      context: ./TC_faction_crimes
      dockerfile: Dockerfile
    container_name: tc-faction-crimes-pipeline
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./TC_faction_crimes/config/credentials.json:/app/config/credentials.json:ro
      - ./TC_faction_crimes/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ./TC_faction_crimes/config/oc_records_schema.json:/app/config/oc_records_schema.json:ro
      - ./TC_faction_crimes/logs:/app/logs

  tc-faction-members:
    build:
      context: ./TC_faction_members
      dockerfile: Dockerfile
    container_name: tc-faction-members-pipeline
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./TC_faction_members/config/credentials.json:/app/config/credentials.json:ro
      - ./TC_faction_members/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ./TC_faction_members/logs:/app/logs

  tc-items:
    build:
      context: ./TC_items
      dockerfile: Dockerfile
    container_name: tc-items-pipeline
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./TC_items/config/credentials.json:/app/config/credentials.json:ro
      - ./TC_items/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ./TC_items/logs:/app/logs

  tc-user-events:
    build:
      context: ./TC_user_events
      dockerfile: Dockerfile
    container_name: tc-user-events-pipeline
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./TC_user_events/config/credentials.json:/app/config/credentials.json:ro
      - ./TC_user_events/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ./TC_user_events/logs:/app/logs

  tc-faction-chains:
    build:
      context: ./TC_faction_chains
      dockerfile: Dockerfile
    container_name: tc-faction-chains-pipeline
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
    volumes:
      - ./TC_faction_chains/config/credentials.json:/app/config/credentials.json:ro
      - ./TC_faction_chains/config/TC_API_config.json:/app/config/TC_API_config.json:ro
      - ./TC_faction_chains/logs:/app/logs

  tc-dashboard:
    build:
      context: ./TC_dashboard
      dockerfile: Dockerfile
      args:
        # Set CACHE_BUST environment variable to bust cache: export CACHE_BUST=$(date +%s)
        # Or pass via command line: docker-compose build --build-arg CACHE_BUST=$(date +%s) tc-dashboard
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: tc-dashboard
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - DASHBOARD_PORT=8080
      - DASHBOARD_BASE_PATH=/app/data
      # Set DASHBOARD_SECRET_KEY in .env when internet-accessible (strong random value)
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:-}
      # Set DASHBOARD_MODE=test or local for test instances to prevent disrupting production BigQuery tables
      - DASHBOARD_MODE=${DASHBOARD_MODE:-production}
    ports:
      - "8080:8080"
    volumes:
      - ./TC_faction_crimes/logs:/app/logs/faction_crimes:ro
      - ./TC_faction_members/logs:/app/logs/faction_members:ro
      - ./TC_items/logs:/app/logs/items:ro
      - ./TC_user_events/logs:/app/logs/user_events:ro
      - ./TC_faction_chains/logs:/app/logs/faction_chains:ro
      - ./TC_dashboard/logs:/app/logs
      - ./TC_dashboard:/app/data:ro
      - ./sql_queries:/app/sql_queries:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount credentials for BigQuery access (use one of the microservice credentials)
      - ./TC_faction_crimes/config/credentials.json:/app/config/credentials.json:ro

